<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TripAI – Thanjavur</title>
<style>
:root{
  --pr:#FF5722;--pr2:#E64A19;--pr-bg:#FFF3EF;
  --teal:#00838F;--teal-bg:#E0F7FA;
  --gold:#F59E0B;--gold-bg:#FFFBEB;
  --green:#16A34A;--green-bg:#F0FDF4;
  --red:#DC2626;
  --bg:#F2F2F7;--surface:#FFFFFF;--surface2:#F8F8FA;
  --border:#E4E4E7;--txt:#1C1C1E;--txt2:#48484A;--txt3:#8E8E93;--txt4:#C7C7CC;
  --r8:8px;--r12:12px;--r16:16px;--r99:99px;
  --sh:0 2px 8px rgba(0,0,0,.08);--sh2:0 8px 32px rgba(0,0,0,.12);
  --nav-h:64px;--bar-h:56px;--t:.18s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:var(--txt);-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;border:none;background:none;outline:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

.app-bar{flex-shrink:0;height:var(--bar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:50}
.brand{display:flex;align-items:center;gap:8px}
.brand-ic{width:32px;height:32px;border-radius:var(--r8);background:linear-gradient(135deg,var(--pr),var(--pr2));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.brand-nm{font-size:17px;font-weight:800;letter-spacing:-.3px}
.brand-nm em{color:var(--pr);font-style:normal}
.app-bar-mid{flex:1;display:flex;justify-content:center}
.loc-btn{display:flex;align-items:center;gap:5px;background:var(--pr-bg);border-radius:var(--r99);padding:5px 12px;border:1px solid rgba(255,87,34,.18);max-width:200px}
.loc-lbl{font-size:10px;font-weight:700;color:var(--pr);text-transform:uppercase;letter-spacing:.4px;line-height:1}
.loc-city{font-size:13px;font-weight:700;color:var(--txt);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--pr);animation:pulse 1.1s ease infinite;flex-shrink:0}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--green-bg);flex-shrink:0}

.filter-shell{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border)}
.frow{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.brow{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.brow::-webkit-scrollbar{display:none}

.chip{display:flex;align-items:center;gap:4px;padding:7px 14px;border-radius:var(--r99);font-size:13px;font-weight:600;background:var(--surface2);border:1.5px solid var(--border);color:var(--txt2);white-space:nowrap;transition:var(--t);flex-shrink:0}
.chip:hover{border-color:var(--pr);color:var(--pr)}
.chip.active{background:var(--pr);border-color:var(--pr);color:#fff}
.chip.teal.active{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.teal:hover{border-color:var(--teal);color:var(--teal)}

.tab-row{display:flex;border-top:1px solid var(--border)}
.tab-btn{flex:1;padding:10px;font-size:13px;font-weight:700;color:var(--txt3);border-bottom:2px solid transparent;transition:var(--t)}
.tab-btn.active{color:var(--pr);border-bottom-color:var(--pr)}

.main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel{display:none;padding:12px 16px;padding-bottom:calc(var(--nav-h) + 12px)}
.panel.active{display:block}


/* Cards */
.section-lbl{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 8px}
.cards-grid{display:grid;gap:12px}
.card{background:var(--surface);border-radius:var(--r16);overflow:hidden;border:1px solid var(--border);box-shadow:var(--sh);transition:var(--t)}
.card:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.card-accent{height:4px}
.card-body{padding:12px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-info{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:800;color:var(--txt);line-height:1.2;margin-bottom:3px}
.card-addr{font-size:12px;color:var(--txt3);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--gold);font-size:12px;letter-spacing:.5px}
.rating-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rating-val{font-size:14px;font-weight:800;color:var(--txt)}
.rating-cnt{font-size:12px;color:var(--txt3)}
.price-badge{background:var(--green-bg);color:var(--green);font-size:14px;font-weight:800;padding:6px 10px;border-radius:var(--r8);white-space:nowrap;flex-shrink:0}
.tags-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r99);background:var(--surface2);color:var(--txt2);border:1px solid var(--border)}
.amenity-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.amenity{font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r99);background:var(--pr-bg);color:var(--pr)}


/* GBP reviews */
.gbp-block{border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.gbp-hdr{font-size:11px;font-weight:700;color:var(--txt3);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.gbp-quotes{display:flex;flex-direction:column;gap:4px}
.gbp-q{font-size:12px;color:var(--txt2);font-style:italic;line-height:1.4}
.gbp-q::before{content:'"'}
.gbp-q::after{content:'"'}

/* Restaurant extras */
.diet-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r99)}
.diet-badge.pure-veg{background:var(--green-bg);color:var(--green)}
.diet-badge.veg{background:#F0FDF4;color:#15803D}
.diet-badge.non-veg{background:#FEF2F2;color:var(--red)}
.open-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r99)}
.open-badge.open{background:var(--green-bg);color:var(--green)}
.open-badge.closed{background:#FEF2F2;color:var(--red)}
.dishes-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.dish{font-size:11px;padding:3px 8px;border-radius:var(--r99);background:var(--teal-bg);color:var(--teal);font-weight:600}

/* Budget range row */
.budget-range{padding:0 16px 12px;display:flex;align-items:center;gap:8px}
.budget-range label{font-size:12px;font-weight:700;color:var(--txt2);white-space:nowrap}
.budget-range input[type=range]{flex:1;accent-color:var(--pr)}
.budget-val{font-size:12px;font-weight:700;color:var(--pr);min-width:50px;text-align:right}


/* Empty state */
.empty{text-align:center;padding:48px 24px;color:var(--txt3)}
.empty-ic{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:15px;font-weight:600}

/* Bottom nav */
.bottom-nav{flex-shrink:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--txt4);transition:var(--t)}
.nav-btn.active{color:var(--pr)}
.nav-ic{font-size:22px;line-height:1}
.nav-lbl{font-size:10px;font-weight:700;letter-spacing:.2px}

/* Shimmer */
.shimmer{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.2s ease infinite;border-radius:var(--r8)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sh-card{height:180px;border-radius:var(--r16);margin-bottom:12px}

.main-wrap{display:flex;flex:1;overflow:hidden}
</style>
</head>

<div id="app">
  <!-- App Bar -->

  </div>

  <div class="filter-shell" id="rest-filters" style="display:none">

      <button class="chip teal" data-val="north-indian">North Indian</button>
      <button class="chip teal" data-val="chinese">Chinese</button>
      <button class="chip teal" data-val="continental">Continental</button>
      <button class="chip teal" data-val="seafood">Seafood</button>
      <button class="chip teal" data-val="cafe">Cafe</button>
    </div>
    <div class="brow" id="open-chips">
      <button class="chip teal active" data-val="all">All Hours</button>
      <button class="chip teal" data-val="open">🟢 Open Now</button>
      <button class="chip teal" data-val="rating">⭐ 4.0+ Rating</button>
    </div>
  </div>

  <!-- Tab row (inside main-wrap for layout) -->
  <div class="tab-row">
    <button class="tab-btn active" id="tab-hotels" onclick="switchTab('hotels')">🏨 Hotels</button>
    <button class="tab-btn" id="tab-restaurants" onclick="switchTab('restaurants')">🍽️ Restaurants</button>
  </div>

  <!-- Main content -->
  <div class="main-wrap">
    <div class="main-scroll">
      <!-- Hotels Panel -->
      <div class="panel active" id="panel-hotels">
        <div class="section-lbl" id="hotels-lbl">All Hotels</div>
        <div class="cards-grid" id="hotels-grid"></div>
      </div>

      <!-- Restaurants Panel -->
      <div class="panel" id="panel-restaurants">
        <div class="section-lbl">Restaurants & Cafes</div>
        <div class="cards-grid" id="rests-grid"></div>
      </div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-hotels" onclick="switchTab('hotels')">
      <div class="nav-ic">🏨</div>
      <div class="nav-lbl">Hotels</div>
    </button>
    <button class="nav-btn" id="nav-restaurants" onclick="switchTab('restaurants')">
      <div class="nav-ic">🍽️</div>
      <div class="nav-lbl">Restaurants</div>
    </button>
  </div>
</div>

];


// ═══════════════════════ STATE ═══════════════════════
let guestFilter = 'all';
let budgetFilter = 'all';
let maxPrice = 10000;
let dietFilter = 'all';
let cuisineFilter = 'all';
let openFilter = 'all';
let currentTab = 'hotels';

// ═══════════════════════ INIT ═══════════════════════
window.addEventListener('DOMContentLoaded', () => {
  renderHotels();
  renderRestaurants();
  setupChips('guest-chips', v => { guestFilter = v; renderHotels(); });
  setupChips('budget-chips', v => { budgetFilter = v; renderHotels(); });
  setupChips('diet-chips', v => { dietFilter = v; renderRestaurants(); }, true);
  setupChips('cuisine-chips', v => { cuisineFilter = v; renderRestaurants(); }, true);
  setupChips('open-chips', v => { openFilter = v; renderRestaurants(); }, true);
  document.getElementById('budget-slider').addEventListener('input', e => {
    maxPrice = +e.target.value;
    document.getElementById('budget-display').textContent = maxPrice >= 10000 ? 'Any' : '₹'+maxPrice.toLocaleString('en-IN');
    renderHotels();
  });
});

// ═══════════════════════ CHIPS ═══════════════════════
function setupChips(rowId, onChange, teal=false) {
  document.getElementById(rowId).querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(rowId).querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      onChange(btn.dataset.val);
    });
  });
}

// ═══════════════════════ HOTELS ═══════════════════════
function filterHotels() {
  return HOTELS.filter(h => {
    if(maxPrice < 10000 && h.price > maxPrice) return false;
    if(guestFilter !== 'all' && !h.guest_types.includes(guestFilter)) return false;
    if(budgetFilter !== 'all' && h.budget_category !== budgetFilter) return false;
    return true;
  });
}

function renderHotels() {
  const grid = document.getElementById('hotels-grid');
  const lbl = document.getElementById('hotels-lbl');
  const hotels = filterHotels();
  lbl.textContent = 'All Hotels (' + hotels.length + ')';
  if(!hotels.length) { grid.innerHTML = `<div class="empty"><div class="empty-ic">🏨</div><div class="empty-txt">No hotels match your filters</div></div>`; return; }
  grid.innerHTML = hotels.map(h => hotelCard(h)).join('');
}

function hotelCard(h) {
  const stars = '★'.repeat(h.stars) + '☆'.repeat(5-h.stars);
  return `
  <div class="card">
    <div class="card-accent" style="background:${h.color}"></div>
    <div class="card-body">
      <div class="card-top">
        <div class="card-info">
          <div class="card-name">${h.name}</div>
          <div class="card-addr">📍 ${h.address}</div>
          <div class="stars">${stars}</div>
          <div class="rating-row">
            <span class="rating-val">${h.rating}</span>
            <span class="rating-cnt">(${h.reviews_count.toLocaleString('en-IN')} reviews)</span>
          </div>
        </div>
        <div class="price-badge">₹${h.price.toLocaleString('en-IN')}<br/><span style="font-size:10px;font-weight:600;opacity:.7">/ night</span></div>
      </div>
      <div class="tags-row">${h.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="amenity-row">${h.amenities.map(a=>`<span class="amenity">${a}</span>`).join('')}</div>
      <div style="font-size:12px;color:var(--txt3);line-height:1.5">${h.description}</div>
    </div>
  </div>`;
}

// ═══════════════════════ RESTAURANTS ═══════════════════════
function filterRestaurants() {
  return RESTAURANTS.filter(r => {
    if(dietFilter !== 'all' && r.diet !== dietFilter) return false;
    if(cuisineFilter !== 'all' && !r.cuisines.includes(cuisineFilter)) return false;
    if(openFilter === 'open' && !r.open_now) return false;
    if(openFilter === 'rating' && r.rating < 4.0) return false;
    return true;
  }).sort((a,b) => b.rating - a.rating);
}

function renderRestaurants() {
  const grid = document.getElementById('rests-grid');
  const list = filterRestaurants();
  if(!list.length) { grid.innerHTML = `<div class="empty"><div class="empty-ic">🍽️</div><div class="empty-txt">No restaurants match your filters</div></div>`; return; }
  grid.innerHTML = list.map(r => restaurantCard(r)).join('');
}

function restaurantCard(r) {
  const dietClass = r.diet === 'pure-veg' ? 'pure-veg' : r.diet === 'veg' ? 'veg' : 'non-veg';
  const dietLabel = r.diet === 'pure-veg' ? '🌿 Pure Veg' : r.diet === 'veg' ? '🥗 Veg' : '🍗 Non-Veg';
  const openClass = r.open_now ? 'open' : 'closed';
  const openLabel = r.open_now ? '🟢 Open' : '🔴 Closed';
  const priceLabel = r.price_range === 'low' ? '₹ Budget' : r.price_range === 'medium' ? '₹₹ Mid' : '₹₹₹ Premium';
  return `
  <div class="card">
    <div class="card-accent" style="background:${r.color}"></div>
    <div class="card-body">
      <div class="card-top">
        <div class="card-info">
          <div class="card-name">${r.name}</div>
          <div class="card-addr">📍 ${r.address}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px">
            <span class="diet-badge ${dietClass}">${dietLabel}</span>
            <span class="open-badge ${openClass}">${openLabel}</span>
          </div>
          <div class="rating-row">
            <span class="rating-val">${r.rating}</span>
            <span class="rating-cnt">(${r.reviews_count.toLocaleString('en-IN')} reviews)</span>
          </div>
        </div>
        <div>
          <div class="price-badge">₹${r.price_for_two}<br/><span style="font-size:10px;opacity:.7">for 2</span></div>
          <div style="font-size:11px;color:var(--txt3);text-align:center;margin-top:4px">${priceLabel}</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--txt3);margin-bottom:6px">🕐 ${r.timing} &nbsp;•&nbsp; 📍 ${r.distance} km</div>
      <div class="dishes-row">${r.popular_dishes.map(d=>`<span class="dish">${d}</span>`).join('')}</div>
      <div class="tags-row">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="gbp-block">
        <div class="gbp-hdr">⭐ Google Reviews</div>
        <div class="gbp-quotes">${r.gbp_highlights.map(q=>`<div class="gbp-q">${q}</div>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════ TAB SWITCH ═══════════════════════
function switchTab(tab) {
  currentTab = tab;
  ['hotels','restaurants'].forEach(t => {
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('nav-'+t).classList.toggle('active', t===tab);
  });
  document.getElementById('hotel-filters').style.display = tab==='hotels' ? '' : 'none';
  document.getElementById('rest-filters').style.display = tab==='restaurants' ? '' : 'none';
}

</script>
</body>
</html>
