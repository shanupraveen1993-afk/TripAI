<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Backdrop -->
  <rect width="1440" height="900" fill="rgba(0, 0, 0, 0.55)"/>

  <!-- Modal Container -->
  <rect x="440" y="120" width="560" height="660" rx="20" fill="#FFFFFF"/>

  <!-- Modal Header -->
  <text x="480" y="180" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#111827">Add App to Track</text>

  <!-- Close Button -->
  <circle cx="960" cy="160" r="16" fill="#F3F4F6"/>
  <text x="954" y="168" font-family="Inter, sans-serif" font-size="20" fill="#6B7280">×</text>

  <!-- Store Selection -->
  <text x="480" y="230" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">App Store</text>

  <!-- iOS Radio Button -->
  <g id="ios-radio">
    <circle cx="490" cy="265" r="10" fill="transparent" stroke="#FF5722" stroke-width="2"/>
    <circle cx="490" cy="265" r="5" fill="#FF5722"/>
    <text x="515" y="272" font-family="Inter, sans-serif" font-size="16" fill="#111827">iOS App Store</text>
  </g>

  <!-- Android Radio Button -->
  <g id="android-radio">
    <circle cx="670" cy="265" r="10" fill="transparent" stroke="#E5E7EB" stroke-width="2"/>
    <text x="695" y="272" font-family="Inter, sans-serif" font-size="16" fill="#6B7280">Google Play Store</text>
  </g>

  <!-- App URL Input -->
  <text x="480" y="325" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">App URL or ID</text>
  <rect x="480" y="335" width="480" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="496" y="368" font-family="Inter, sans-serif" font-size="16" fill="#9CA3AF">https://apps.apple.com/us/app/...</text>

  <!-- OR Divider -->
  <line x1="480" y1="425" x2="650" y2="425" stroke="#E5E7EB" stroke-width="1"/>
  <text x="665" y="430" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">OR</text>
  <line x1="700" y1="425" x2="960" y2="425" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Search Input -->
  <text x="480" y="465" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">Search by Name</text>
  <rect x="480" y="475" width="480" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="496" y="491" width="20" height="20" rx="2" fill="#9CA3AF"/>
  <text x="528" y="508" font-family="Inter, sans-serif" font-size="16" fill="#9CA3AF">Search for your app...</text>

  <!-- Countries Section -->
  <text x="480" y="575" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">Countries to Track</text>
  <text x="850" y="575" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">(select multiple)</text>

  <!-- Country Checkboxes Grid -->
  <g id="countries-grid">
    <!-- Row 1 -->
    <g id="country-us">
      <rect x="480" y="590" width="18" height="18" rx="4" fill="#FF5722" stroke="#FF5722" stroke-width="2"/>
      <polyline points="484,598 488,602 496,592" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="510" y="605" font-family="Inter, sans-serif" font-size="16" fill="#111827">🇺🇸 United States</text>
    </g>

    <g id="country-uk">
      <rect x="720" y="590" width="18" height="18" rx="4" fill="#FF5722" stroke="#FF5722" stroke-width="2"/>
      <polyline points="724,598 728,602 736,592" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="750" y="605" font-family="Inter, sans-serif" font-size="16" fill="#111827">🇬🇧 United Kingdom</text>
    </g>

    <!-- Row 2 -->
    <g id="country-ca">
      <rect x="480" y="630" width="18" height="18" rx="4" fill="#FF5722" stroke="#FF5722" stroke-width="2"/>
      <polyline points="484,638 488,642 496,632" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="510" y="645" font-family="Inter, sans-serif" font-size="16" fill="#111827">🇨🇦 Canada</text>
    </g>

    <g id="country-au">
      <rect x="720" y="630" width="18" height="18" rx="4" fill="transparent" stroke="#E5E7EB" stroke-width="2"/>
      <text x="750" y="645" font-family="Inter, sans-serif" font-size="16" fill="#6B7280">🇦🇺 Australia</text>
    </g>

    <!-- Row 3 -->
    <g id="country-de">
      <rect x="480" y="670" width="18" height="18" rx="4" fill="#FF5722" stroke="#FF5722" stroke-width="2"/>
      <polyline points="484,678 488,682 496,672" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="510" y="685" font-family="Inter, sans-serif" font-size="16" fill="#111827">🇩🇪 Germany</text>
    </g>

    <g id="country-fr">
      <rect x="720" y="670" width="18" height="18" rx="4" fill="transparent" stroke="#E5E7EB" stroke-width="2"/>
      <text x="750" y="685" font-family="Inter, sans-serif" font-size="16" fill="#6B7280">🇫🇷 France</text>
    </g>

    <!-- Row 4 -->
    <g id="country-it">
      <rect x="480" y="710" width="18" height="18" rx="4" fill="transparent" stroke="#E5E7EB" stroke-width="2"/>
      <text x="510" y="725" font-family="Inter, sans-serif" font-size="16" fill="#6B7280">🇮🇹 Italy</text>
    </g>

    <g id="country-es">
      <rect x="720" y="710" width="18" height="18" rx="4" fill="transparent" stroke="#E5E7EB" stroke-width="2"/>
      <text x="750" y="725" font-family="Inter, sans-serif" font-size="16" fill="#6B7280">🇪🇸 Spain</text>
    </g>
  </g>

  <!-- Category Dropdown -->
  <text x="480" y="770" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">Category</text>
  <rect x="480" y="780" width="480" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="496" y="813" font-family="Inter, sans-serif" font-size="16" fill="#111827">Overall Free</text>

  <!-- Dropdown Arrow -->
  <polygon points="935,805 940,810 945,805" fill="#6B7280"/>

  <!-- Action Buttons -->
  <g id="modal-actions">
    <rect x="560" y="720" width="120" height="40" rx="12" fill="transparent" stroke="#E5E7EB" stroke-width="1"/>
    <text x="600" y="745" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">Cancel</text>

    <rect x="700" y="720" width="120" height="40" rx="12" fill="#FF5722"/>
    <text x="730" y="745" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Add App</text>
  </g>
</svg>
