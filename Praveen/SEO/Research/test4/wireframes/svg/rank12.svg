<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif; }
      .display-large { font-size: 57px; line-height: 64px; font-weight: 600; fill: #111827; }
      .display-small { font-size: 36px; line-height: 44px; font-weight: 600; fill: #111827; }
      .headline { font-size: 32px; line-height: 40px; font-weight: 600; fill: #111827; }
      .title { font-size: 22px; line-height: 28px; font-weight: 600; fill: #111827; }
      .body-large { font-size: 16px; line-height: 24px; font-weight: 400; fill: #111827; }
      .body-small { font-size: 14px; line-height: 20px; font-weight: 400; fill: #6B7280; }
      .label { font-size: 14px; line-height: 20px; font-weight: 600; fill: #111827; }
      .section-title { font-size: 22px; font-weight: 600; fill: #111827; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#FFFFFF"/>

  <!-- Grid Container -->
  <g id="component-library">

    <!-- Typography Section -->
    <g id="typography-section" transform="translate(48, 48)">
      <text class="section-title" x="0" y="0">Typography</text>
      <text class="display-large" x="0" y="80">Display Large</text>
      <text class="display-small" x="0" y="168">Display Small</text>
      <text class="headline" x="0" y="232">Headline Large</text>
      <text class="title" x="0" y="280">Title Large</text>
      <text class="body-large" x="0" y="324">Body Large</text>
      <text class="body-small" x="0" y="360">Body Small</text>
      <text class="label" x="0" y="392">Label Large</text>
    </g>

    <!-- Color Palette Section -->
    <g id="colors-section" transform="translate(520, 48)">
      <text class="section-title" x="0" y="0">Color Palette</text>

      <!-- Brand Colors -->
      <text class="body-small" x="0" y="36">Brand</text>
      <rect x="0" y="48" width="48" height="48" rx="8" fill="#FF5722"/>
      <rect x="56" y="48" width="48" height="48" rx="8" fill="#FFA726"/>
      <rect x="112" y="48" width="48" height="48" rx="8" fill="#E64A19"/>
      <rect x="168" y="48" width="48" height="48" rx="8" fill="#FFF3E0"/>
      <rect x="224" y="48" width="48" height="48" rx="8" fill="#BF360C"/>

      <!-- Neutral Grays -->
      <text class="body-small" x="0" y="128">Neutrals</text>
      <rect x="0" y="140" width="36" height="36" rx="6" fill="#F9FAFB"/>
      <rect x="44" y="140" width="36" height="36" rx="6" fill="#E5E7EB"/>
      <rect x="88" y="140" width="36" height="36" rx="6" fill="#D1D5DB"/>
      <rect x="132" y="140" width="36" height="36" rx="6" fill="#9CA3AF"/>
      <rect x="176" y="140" width="36" height="36" rx="6" fill="#6B7280"/>
      <rect x="220" y="140" width="36" height="36" rx="6" fill="#374151"/>
      <rect x="264" y="140" width="36" height="36" rx="6" fill="#111827"/>

      <!-- Semantic Colors -->
      <text class="body-small" x="0" y="208">Semantic</text>
      <rect x="0" y="220" width="48" height="48" rx="8" fill="#10B981"/>
      <text class="body-small" x="0" y="280">Success</text>
      <rect x="64" y="220" width="48" height="48" rx="8" fill="#DC2626"/>
      <text class="body-small" x="64" y="280">Error</text>
      <rect x="128" y="220" width="48" height="48" rx="8" fill="#F59E0B"/>
      <text class="body-small" x="128" y="280">Warning</text>
    </g>

    <!-- Buttons Section -->
    <g id="buttons-section" transform="translate(48, 480)">
      <text class="section-title" x="0" y="0">Buttons</text>

      <!-- Filled Buttons -->
      <text class="body-small" x="0" y="36">Filled</text>
      <rect x="0" y="48" width="160" height="48" rx="12" fill="#FF5722"/>
      <text x="80" y="78" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">Button Large</text>

      <rect x="176" y="52" width="140" height="40" rx="12" fill="#FF5722"/>
      <text x="246" y="78" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Button</text>

      <rect x="332" y="56" width="120" height="36" rx="12" fill="#FF5722"/>
      <text x="392" y="78" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Button Small</text>

      <!-- Outlined Buttons -->
      <text class="body-small" x="0" y="136">Outlined</text>
      <rect x="0" y="148" width="160" height="48" rx="12" fill="none" stroke="#FF5722" stroke-width="2"/>
      <text x="80" y="178" text-anchor="middle" fill="#FF5722" font-size="16" font-weight="600">Button Large</text>

      <rect x="176" y="152" width="140" height="40" rx="12" fill="none" stroke="#FF5722" stroke-width="2"/>
      <text x="246" y="178" text-anchor="middle" fill="#FF5722" font-size="14" font-weight="600">Button</text>

      <rect x="332" y="156" width="120" height="36" rx="12" fill="none" stroke="#FF5722" stroke-width="2"/>
      <text x="392" y="178" text-anchor="middle" fill="#FF5722" font-size="14" font-weight="600">Button Small</text>

      <!-- Text Buttons -->
      <text class="body-small" x="0" y="236">Text</text>
      <text x="80" y="278" text-anchor="middle" fill="#FF5722" font-size="16" font-weight="600">Button Large</text>
      <text x="246" y="278" text-anchor="middle" fill="#FF5722" font-size="14" font-weight="600">Button</text>
      <text x="392" y="278" text-anchor="middle" fill="#FF5722" font-size="14" font-weight="600">Button Small</text>
    </g>

    <!-- Form Elements Section -->
    <g id="form-elements-section" transform="translate(520, 480)">
      <text class="section-title" x="0" y="0">Form Elements</text>

      <!-- Text Input -->
      <text class="label" x="0" y="36">Email Address</text>
      <rect x="0" y="48" width="280" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="16" y="82" fill="#9CA3AF" font-size="16">Enter your email</text>

      <!-- Select Dropdown -->
      <text class="label" x="0" y="140">Category</text>
      <rect x="0" y="152" width="280" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="16" y="186" fill="#111827" font-size="16">Select category</text>
      <path d="M252 182 L258 188 L264 182" stroke="#6B7280" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Checkbox -->
      <g transform="translate(0, 236)">
        <rect x="0" y="0" width="24" height="24" rx="6" fill="#FF5722" stroke="#FF5722" stroke-width="2"/>
        <path d="M6 12 L10 16 L18 8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="18" fill="#111827" font-size="14">Checked</text>

        <rect x="120" y="0" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <text x="152" y="18" fill="#111827" font-size="14">Unchecked</text>
      </g>

      <!-- Radio Button -->
      <g transform="translate(0, 280)">
        <circle cx="12" cy="12" r="12" fill="#FFFFFF" stroke="#FF5722" stroke-width="2"/>
        <circle cx="12" cy="12" r="6" fill="#FF5722"/>
        <text x="32" y="18" fill="#111827" font-size="14">Selected</text>

        <circle cx="132" cy="12" r="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <text x="152" y="18" fill="#111827" font-size="14">Unselected</text>
      </g>

      <!-- Switch -->
      <g transform="translate(0, 324)">
        <rect x="0" y="0" width="48" height="28" rx="14" fill="#FF5722"/>
        <circle cx="34" cy="14" r="10" fill="#FFFFFF"/>
        <text x="56" y="20" fill="#111827" font-size="14">On</text>

        <rect x="110" y="0" width="48" height="28" rx="14" fill="#E5E7EB"/>
        <circle cx="124" cy="14" r="10" fill="#FFFFFF"/>
        <text x="166" y="20" fill="#111827" font-size="14">Off</text>
      </g>

      <!-- Chip -->
      <g transform="translate(0, 376)">
        <rect x="0" y="0" width="120" height="32" rx="16" fill="#FFF3E0" stroke="#FF5722" stroke-width="1"/>
        <text x="16" y="21" fill="#BF360C" font-size="14" font-weight="600">Removable</text>
        <circle cx="102" cy="16" r="8" fill="#FF5722"/>
        <path d="M99 13 L105 19 M105 13 L99 19" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Cards Section -->
    <g id="cards-section" transform="translate(880, 48)">
      <text class="section-title" x="0" y="0">Cards</text>

      <!-- Standard Card -->
      <rect x="0" y="24" width="280" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="24" y="56" class="title">Card Title</text>
      <text x="24" y="84" class="body-small">This is a standard card component</text>
      <text x="24" y="108" class="body-small">with padding of 24px and a border</text>
      <text x="24" y="132" class="body-small">radius of 16px.</text>

      <!-- KPI Card -->
      <rect x="0" y="188" width="280" height="120" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="24" y="54" class="display-small" transform="translate(0, 188)">245</text>
      <text x="24" y="88" class="body-small" transform="translate(0, 188)">Keywords Tracked</text>
      <text x="200" y="54" fill="#10B981" font-size="22" font-weight="600" transform="translate(0, 188)">↑ 12%</text>

      <!-- Stat Card -->
      <rect x="0" y="332" width="280" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <circle cx="36" cy="368" r="20" fill="#FFF3E0"/>
      <text x="36" y="376" text-anchor="middle" fill="#FF5722" font-size="24">📊</text>
      <text x="72" y="366" class="headline" font-size="28">1,847</text>
      <text x="72" y="390" class="body-small">Total Searches</text>
      <text x="200" y="366" fill="#10B981" font-size="18" font-weight="600">+24%</text>
    </g>

    <!-- Table Section -->
    <g id="table-section" transform="translate(880, 480)">
      <text class="section-title" x="0" y="0">Table</text>

      <!-- Header Row -->
      <rect x="0" y="24" width="512" height="48" rx="8" fill="#F9FAFB"/>
      <text x="16" y="54" class="label">Keyword</text>
      <text x="240" y="54" class="label">Rank</text>
      <text x="320" y="54" class="label">Change</text>
      <text x="420" y="54" class="label">Volume</text>

      <!-- Data Row 1 -->
      <line x1="0" y1="72" x2="512" y2="72" stroke="#E5E7EB" stroke-width="1"/>
      <text x="16" y="102" class="body-large">app store optimization</text>
      <rect x="240" y="82" width="40" height="28" rx="8" fill="#FFF3E0"/>
      <text x="260" y="102" text-anchor="middle" fill="#BF360C" font-size="14" font-weight="600">#12</text>
      <text x="320" y="102" fill="#10B981" font-size="14" font-weight="600">↑ 3</text>
      <text x="420" y="102" class="body-large">18.5K</text>

      <!-- Data Row 2 -->
      <line x1="0" y1="120" x2="512" y2="120" stroke="#E5E7EB" stroke-width="1"/>
      <text x="16" y="150" class="body-large">keyword research tool</text>
      <rect x="240" y="130" width="40" height="28" rx="8" fill="#FFF3E0"/>
      <text x="260" y="150" text-anchor="middle" fill="#BF360C" font-size="14" font-weight="600">#7</text>
      <text x="320" y="150" fill="#10B981" font-size="14" font-weight="600">↑ 1</text>
      <text x="420" y="150" class="body-large">12.3K</text>

      <!-- Data Row 3 -->
      <line x1="0" y1="168" x2="512" y2="168" stroke="#E5E7EB" stroke-width="1"/>
      <text x="16" y="198" class="body-large">rank tracker</text>
      <rect x="240" y="178" width="40" height="28" rx="8" fill="#FFF3E0"/>
      <text x="260" y="198" text-anchor="middle" fill="#BF360C" font-size="14" font-weight="600">#3</text>
      <text x="320" y="198" fill="#DC2626" font-size="14" font-weight="600">↓ 2</text>
      <text x="420" y="198" class="body-large">24.1K</text>
      <line x1="0" y1="216" x2="512" y2="216" stroke="#E5E7EB" stroke-width="1"/>
    </g>

    <!-- Navigation Section -->
    <g id="navigation-section" transform="translate(1200, 48)">
      <text class="section-title" x="0" y="0">Navigation</text>

      <!-- Sidebar Nav -->
      <text class="body-small" x="0" y="36">Sidebar</text>
      <rect x="0" y="48" width="192" height="44" rx="12" fill="#FF5722"/>
      <text x="16" y="76" fill="#FFFFFF" font-size="14" font-weight="600">Dashboard</text>

      <rect x="0" y="100" width="192" height="44" rx="12" fill="#FFFFFF"/>
      <text x="16" y="128" fill="#6B7280" font-size="14" font-weight="600">Rankings</text>

      <rect x="0" y="152" width="192" height="44" rx="12" fill="#FFFFFF"/>
      <text x="16" y="180" fill="#6B7280" font-size="14" font-weight="600">Keywords</text>

      <!-- Tabs -->
      <text class="body-small" x="0" y="236">Tabs</text>
      <g transform="translate(0, 248)">
        <text x="0" y="24" fill="#FF5722" font-size="14" font-weight="600">Overview</text>
        <rect x="0" y="32" width="72" height="3" rx="1.5" fill="#FF5722"/>

        <text x="96" y="24" fill="#6B7280" font-size="14" font-weight="600">Details</text>

        <text x="176" y="24" fill="#6B7280" font-size="14" font-weight="600">History</text>
      </g>

      <!-- Breadcrumbs -->
      <text class="body-small" x="0" y="324">Breadcrumbs</text>
      <g transform="translate(0, 336)">
        <text x="0" y="0" fill="#6B7280" font-size="14">Home</text>
        <text x="48" y="0" fill="#6B7280" font-size="14">/</text>
        <text x="60" y="0" fill="#6B7280" font-size="14">Rankings</text>
        <text x="128" y="0" fill="#6B7280" font-size="14">/</text>
        <text x="140" y="0" fill="#111827" font-size="14" font-weight="600">Detail</text>
      </g>
    </g>

    <!-- Modals Section -->
    <g id="modals-section" transform="translate(1200, 420)">
      <text class="section-title" x="0" y="0">Modals</text>

      <!-- Modal -->
      <rect x="0" y="24" width="192" height="140" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="20" y="54" class="title" font-size="18">Modal Title</text>
      <text x="20" y="84" class="body-small">This is a modal dialog</text>
      <text x="20" y="104" class="body-small">with rounded corners.</text>
      <rect x="20" y="124" width="152" height="36" rx="12" fill="#FF5722"/>
      <text x="96" y="148" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Confirm</text>
    </g>

    <!-- Notifications Section -->
    <g id="notifications-section" transform="translate(48, 820)">
      <text class="section-title" x="0" y="0">Notifications</text>

      <!-- Success Toast -->
      <rect x="0" y="24" width="320" height="48" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <text x="40" y="52" fill="#065F46" font-size="14">✓ Keyword added successfully</text>

      <!-- Error Toast -->
      <rect x="340" y="24" width="260" height="48" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
      <text x="380" y="52" fill="#991B1B" font-size="14">✕ Export failed</text>

      <!-- Info Alert -->
      <rect x="620" y="24" width="360" height="48" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <text x="660" y="52" fill="#1E40AF" font-size="14">ℹ Processing your request...</text>
    </g>

    <!-- Icons & Avatars Section -->
    <g id="icons-avatars-section" transform="translate(1040, 820)">
      <text class="section-title" x="0" y="0">Icons &amp; Avatars</text>

      <!-- Icon Sizes -->
      <text class="body-small" x="0" y="36">Icons</text>
      <circle cx="8" cy="56" r="8" fill="#E5E7EB"/>
      <circle cx="36" cy="60" r="12" fill="#E5E7EB"/>
      <circle cx="72" cy="64" r="16" fill="#E5E7EB"/>
      <circle cx="120" cy="68" r="20" fill="#E5E7EB"/>

      <!-- Avatar Sizes -->
      <text class="body-small" x="180" y="36">Avatars</text>
      <circle cx="196" cy="64" r="16" fill="#FF5722"/>
      <text x="196" y="69" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">JD</text>

      <circle cx="244" cy="68" r="20" fill="#FF5722"/>
      <text x="244" y="73" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">JD</text>

      <circle cx="300" cy="72" r="24" fill="#FF5722"/>
      <text x="300" y="78" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">JD</text>

      <circle cx="368" cy="76" r="32" fill="#FF5722"/>
      <text x="368" y="84" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600">JD</text>
    </g>

    <!-- Dividers -->
    <line x1="48" y1="460" x2="1392" y2="460" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="48" y1="800" x2="1392" y2="800" stroke="#E5E7EB" stroke-width="1"/>

  </g>
</svg>