<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .inter { font-family: 'Inter', sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }

      .text-32 { font-size: 32px; }
      .text-16 { font-size: 16px; }
      .text-14 { font-size: 14px; }

      .brand { fill: #FF5722; }
      .text-primary { fill: #1A1A1A; }
      .text-secondary { fill: #6B7280; }
      .text-white { fill: #FFFFFF; }
      .bg-white { fill: #FFFFFF; }
      .bg-surface { fill: #F9FAFB; }
      .border { stroke: #E5E7EB; }
      .checkmark { fill: #10B981; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#FFFFFF"/>

  <!-- Split Screen Layout -->
  <!-- Left Side (720px) - White Background -->
  <rect x="0" y="0" width="720" height="900" class="bg-white"/>

  <!-- Right Side (720px) - Surface Background -->
  <rect x="720" y="0" width="720" height="900" class="bg-surface"/>

  <!-- LEFT SIDE CONTENT -->

  <!-- Logo (Top Left) -->
  <g transform="translate(60, 60)">
    <!-- Logo Icon (32x32) -->
    <rect width="32" height="32" rx="6" class="brand"/>
    <rect x="6" y="6" width="20" height="20" rx="3" class="bg-white"/>
    <path d="M 13 16 L 16 19 L 22 13" stroke="#FF5722" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Logo Text -->
    <text x="44" y="24" class="inter semibold text-16 text-primary">Rank Tracker</text>
  </g>

  <!-- Centered Form Container (400px width) -->
  <g transform="translate(160, 180)">

    <!-- Heading -->
    <text x="200" y="0" text-anchor="middle" class="inter bold text-32 text-primary">Welcome to Rank Tracker</text>

    <!-- Subheading -->
    <text x="200" y="48" text-anchor="middle" class="inter regular text-16 text-secondary">Sign up to start tracking your app rankings</text>

    <!-- OAuth Buttons -->
    <!-- Google Button -->
    <g transform="translate(0, 88)">
      <rect width="400" height="56" rx="12" fill="none" class="border" stroke-width="1.5"/>

      <!-- Google Icon -->
      <circle cx="28" cy="28" r="10" fill="#4285F4"/>
      <path d="M 25 28 L 28 31 L 33 26" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <text x="200" y="36" text-anchor="middle" class="inter medium text-16 text-primary">Continue with Google</text>
    </g>

    <!-- Apple Button -->
    <g transform="translate(0, 152)">
      <rect width="400" height="56" rx="12" fill="none" class="border" stroke-width="1.5"/>

      <!-- Apple Icon -->
      <path d="M 28 22 C 28 22 30 20 30 17 C 30 17 27 17 26 20 M 28 22 C 25 22 23 24 23 27 C 23 32 28 38 28 38 C 28 38 33 32 33 27 C 33 24 31 22 28 22 Z" class="text-primary"/>

      <text x="200" y="36" text-anchor="middle" class="inter medium text-16 text-primary">Continue with Apple</text>
    </g>

    <!-- Divider with OR -->
    <g transform="translate(0, 232)">
      <line x1="0" y1="12" x2="170" y2="12" class="border" stroke-width="1"/>
      <text x="200" y="18" text-anchor="middle" class="inter regular text-14 text-secondary">OR</text>
      <line x1="230" y1="12" x2="400" y2="12" class="border" stroke-width="1"/>
    </g>

    <!-- Email Input -->
    <g transform="translate(0, 268)">
      <text x="0" y="0" class="inter medium text-14 text-primary">Email address</text>
      <rect y="8" width="400" height="56" rx="12" fill="none" class="border" stroke-width="1.5"/>
      <text x="20" y="46" class="inter regular text-16 text-secondary">your.email@example.com</text>
    </g>

    <!-- Password Input -->
    <g transform="translate(0, 356)">
      <text x="0" y="0" class="inter medium text-14 text-primary">Password</text>
      <rect y="8" width="400" height="56" rx="12" fill="none" class="border" stroke-width="1.5"/>

      <!-- Password dots -->
      <g transform="translate(20, 36)">
        <circle cx="0" cy="0" r="3" class="text-secondary"/>
        <circle cx="12" cy="0" r="3" class="text-secondary"/>
        <circle cx="24" cy="0" r="3" class="text-secondary"/>
        <circle cx="36" cy="0" r="3" class="text-secondary"/>
        <circle cx="48" cy="0" r="3" class="text-secondary"/>
        <circle cx="60" cy="0" r="3" class="text-secondary"/>
        <circle cx="72" cy="0" r="3" class="text-secondary"/>
        <circle cx="84" cy="0" r="3" class="text-secondary"/>
      </g>

      <!-- Show/Hide Icon -->
      <g transform="translate(365, 36)">
        <circle cx="0" cy="0" r="10" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="4" fill="#9CA3AF"/>
      </g>
    </g>

    <!-- Password Strength -->
    <text x="0" y="444" class="inter regular text-14 text-secondary">8+ characters, 1 uppercase, 1 number</text>

    <!-- Checkbox Terms -->
    <g transform="translate(0, 468)">
      <rect width="20" height="20" rx="4" fill="none" class="border" stroke-width="1.5"/>
      <path d="M 5 10 L 9 14 L 15 6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="28" y="15" class="inter regular text-14 text-primary">I agree to Terms of Service</text>
    </g>

    <!-- Create Account Button -->
    <g transform="translate(0, 516)">
      <rect width="400" height="48" rx="12" class="brand"/>
      <text x="200" y="32" text-anchor="middle" class="inter semibold text-16 text-white">Create Account</text>
    </g>

    <!-- Bottom Text -->
    <g transform="translate(0, 588)">
      <text x="200" y="0" text-anchor="middle" class="inter regular text-14 text-secondary">
        Already have an account?
        <tspan class="brand" font-weight="600">Log in</tspan>
      </text>
    </g>

  </g>

  <!-- RIGHT SIDE CONTENT -->

  <g transform="translate(820, 200)">

    <!-- Large Icon/Illustration Placeholder -->
    <g transform="translate(210, 0)">
      <!-- Outer circle -->
      <circle cx="0" cy="0" r="100" fill="#FF5722" opacity="0.1"/>

      <!-- Inner illustration elements -->
      <rect x="-40" y="-40" width="80" height="80" rx="12" fill="#FF5722" opacity="0.3"/>

      <!-- Chart icon -->
      <g transform="translate(-20, 0)">
        <rect x="0" y="-15" width="8" height="30" rx="2" class="brand"/>
        <rect x="14" y="-25" width="8" height="40" rx="2" class="brand"/>
        <rect x="28" y="-10" width="8" height="25" rx="2" class="brand"/>
      </g>
    </g>

    <!-- Headline -->
    <text x="260" y="160" text-anchor="middle" class="inter bold text-32 text-primary">Start tracking in minutes</text>

    <!-- Feature List -->
    <g transform="translate(100, 220)">

      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="12" class="checkmark"/>
        <path d="M -4 0 L -1 3 L 5 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="28" y="6" class="inter medium text-16 text-primary">Track unlimited keywords</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 48)">
        <circle cx="0" cy="0" r="12" class="checkmark"/>
        <path d="M -4 0 L -1 3 L 5 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="28" y="6" class="inter medium text-16 text-primary">Real-time ranking updates</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 96)">
        <circle cx="0" cy="0" r="12" class="checkmark"/>
        <path d="M -4 0 L -1 3 L 5 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="28" y="6" class="inter medium text-16 text-primary">Competitor intelligence</text>
      </g>

    </g>

    <!-- Stats -->
    <g transform="translate(0, 400)">
      <text x="260" y="0" text-anchor="middle" class="inter semibold text-16 text-secondary">Join 5,000+ developers</text>

      <!-- Stat decoration - small user avatars -->
      <g transform="translate(180, 20)">
        <circle cx="0" cy="0" r="16" fill="#FF5722"/>
        <circle cx="28" cy="0" r="16" fill="#F97316"/>
        <circle cx="56" cy="0" r="16" fill="#FB923C"/>
        <circle cx="84" cy="0" r="16" fill="#FDBA74"/>
        <text x="120" y="6" class="inter regular text-14 text-secondary">and counting...</text>
      </g>
    </g>

  </g>

</svg>
