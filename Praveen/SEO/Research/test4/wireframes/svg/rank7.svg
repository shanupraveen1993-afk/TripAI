<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .display-large { font-family: 'Inter', sans-serif; font-size: 57px; line-height: 64px; font-weight: 600; fill: #111827; }
      .display-small { font-family: 'Inter', sans-serif; font-size: 36px; line-height: 44px; font-weight: 600; fill: #111827; }
      .headline { font-family: 'Inter', sans-serif; font-size: 32px; line-height: 40px; font-weight: 600; fill: #111827; }
      .title { font-family: 'Inter', sans-serif; font-size: 22px; line-height: 28px; font-weight: 600; fill: #111827; }
      .body-large { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 24px; font-weight: 400; fill: #111827; }
      .body-small { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 400; fill: #6B7280; }
      .label { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; fill: #111827; }
      .text-white { fill: #FFFFFF; }
      .text-brand { fill: #FF5722; }
      .text-secondary { fill: #6B7280; }
    </style>
  </defs>

  <!-- Background: Dimmed overlay -->
  <rect width="1440" height="900" fill="#000000" opacity="0.5"/>

  <!-- Simplified background dashboard elements -->
  <g opacity="0.3">
    <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/>
    <rect x="0" y="64" width="240" height="836" fill="#F9FAFB"/>
    <rect x="260" y="84" width="1160" height="796" fill="#FFFFFF" rx="16"/>
  </g>

  <!-- Modal Container (600px width, 800px height, centered) -->
  <g id="modal" transform="translate(420, 50)">
    <rect x="0" y="0" width="600" height="800" rx="16" fill="#FFFFFF"/>
    <g transform="translate(24, 24)">
      <!-- Header Section -->
      <text x="0" y="16" class="title">Add Keywords to Track</text>

      <!-- Close button -->
      <circle cx="528" cy="8" r="16" fill="#F9FAFB"/>
      <line x1="522" y1="2" x2="534" y2="14" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
      <line x1="534" y1="2" x2="522" y2="14" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>

      <!-- Tab Navigation -->
      <g transform="translate(0, 40)">
        <!-- Tab: Manual Entry (ACTIVE) -->
        <text x="0" y="16" class="label">Manual Entry</text>
        <rect x="0" y="24" width="100" height="4" rx="2" fill="#FF5722"/>

        <!-- Tab: Bulk Import -->
        <text x="140" y="16" class="body-small text-secondary">Bulk Import</text>

        <!-- Tab: From Competitors -->
        <text x="260" y="16" class="body-small text-secondary">From Competitors</text>

        <!-- Tab bottom border -->
        <line x1="0" y1="28" x2="552" y2="28" stroke="#E5E7EB" stroke-width="1"/>
      </g>

      <!-- Tab Content Area -->
      <g transform="translate(0, 84)">

        <!-- Keyword Input Section -->
        <text x="0" y="12" class="label">Enter keywords</text>

        <!-- Input area (reduced height: 120→96) -->
        <rect x="0" y="24" width="552" height="96" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

        <!-- Keyword chips -->
        <g transform="translate(12, 36)">
          <rect width="170" height="28" rx="14" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
          <text x="12" y="19" class="body-small" fill="#1565C0">app store optimization</text>
          <circle cx="157" cy="14" r="7" fill="#2196F3"/>
          <line x1="154" y1="11" x2="160" y2="17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="160" y1="11" x2="154" y2="17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <g transform="translate(194, 36)">
          <rect width="80" height="28" rx="14" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
          <text x="12" y="19" class="body-small" fill="#1565C0">aso tool</text>
          <circle cx="67" cy="14" r="7" fill="#2196F3"/>
          <line x1="64" y1="11" x2="70" y2="17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="70" y1="11" x2="64" y2="17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <g transform="translate(286, 36)">
          <rect width="125" height="28" rx="14" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
          <text x="12" y="19" class="body-small" fill="#1565C0">keyword tracker</text>
          <circle cx="112" cy="14" r="7" fill="#2196F3"/>
          <line x1="109" y1="11" x2="115" y2="17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="115" y1="11" x2="109" y2="17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- Placeholder text -->
        <text x="12" y="92" class="body-small">Type keyword and press Enter</text>

        <!-- Helper text (removed to save space) -->

        <!-- AI Suggestions Section (compacted) -->
        <g transform="translate(0, 140)">
          <text x="0" y="12" class="body-large" font-weight="600">Recommended keywords:</text>

          <!-- Grid of keyword chips - Row 1 (3 columns, reduced height: 60→52) -->
          <g transform="translate(0, 28)">
            <rect width="168" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
            <text x="12" y="24" class="label">app ranking</text>
            <text x="12" y="40" class="body-small">12K vol · 65 diff</text>
          </g>

          <g transform="translate(182, 28)">
            <rect width="168" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
            <text x="12" y="24" class="label">mobile seo</text>
            <text x="12" y="40" class="body-small">8K vol · 70 diff</text>
          </g>

          <g transform="translate(364, 28)">
            <rect width="168" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
            <text x="12" y="24" class="label">app optimization</text>
            <text x="12" y="40" class="body-small">15K vol · 68 diff</text>
          </g>

          <!-- Grid of keyword chips - Row 2 -->
          <g transform="translate(0, 92)">
            <rect width="168" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
            <text x="12" y="24" class="label">keyword research</text>
            <text x="12" y="40" class="body-small">10K vol · 72 diff</text>
          </g>

          <g transform="translate(182, 92)">
            <rect width="168" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
            <text x="12" y="24" class="label">aso tips</text>
            <text x="12" y="40" class="body-small">5K vol · 60 diff</text>
          </g>

          <g transform="translate(364, 92)">
            <rect width="168" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
            <text x="12" y="24" class="label">app visibility</text>
            <text x="12" y="40" class="body-small">7K vol · 63 diff</text>
          </g>

          <text x="0" y="164" class="body-small text-brand" text-decoration="underline">+ Show more</text>
        </g>

        <!-- Preview Section (compacted) -->
        <g transform="translate(0, 324)">
          <text x="0" y="12" class="label">Keywords to add (3)</text>

          <!-- Mini table (reduced height: 120→96) -->
          <rect x="0" y="24" width="552" height="96" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>

          <!-- Table header -->
          <g transform="translate(12, 40)">
            <text x="0" y="8" class="body-small text-secondary">Keyword</text>
            <text x="200" y="8" class="body-small text-secondary">Volume</text>
            <text x="300" y="8" class="body-small text-secondary">Difficulty</text>
            <text x="420" y="8" class="body-small text-secondary">Rank</text>
          </g>

          <!-- Row 1 -->
          <line x1="12" y1="68" x2="540" y2="68" stroke="#E5E7EB" stroke-width="1"/>
          <g transform="translate(12, 76)">
            <circle cx="4" cy="6" r="6" fill="#10B981"/>
            <text x="18" y="10" class="body-small">app store optimization</text>
            <text x="200" y="10" class="body-small">18K</text>
            <text x="300" y="10" class="body-small">75</text>
            <text x="420" y="10" class="body-small text-secondary">Not ranked</text>
          </g>

          <!-- Row 2 -->
          <line x1="12" y1="94" x2="540" y2="94" stroke="#E5E7EB" stroke-width="1"/>
          <g transform="translate(12, 102)">
            <circle cx="4" cy="6" r="6" fill="#FF9800"/>
            <text x="18" y="10" class="body-small">aso tool</text>
            <text x="200" y="10" class="body-small">9K</text>
            <text x="300" y="10" class="body-small">68</text>
            <text x="420" y="10" class="body-small" fill="#FF9800">Duplicate</text>
          </g>
        </g>

        <!-- Market Selection (compacted) -->
        <g transform="translate(0, 444)">
          <text x="0" y="12" class="label">Track in markets:</text>

          <g transform="translate(0, 24)">
            <rect width="140" height="32" rx="16" fill="#FF5722"/>
            <text x="12" y="21" class="body-small text-white">🇺🇸 United States</text>
          </g>

          <g transform="translate(154, 24)">
            <rect width="100" height="32" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
            <text x="12" y="21" class="body-small text-brand">+ Add market</text>
          </g>
        </g>
      </g>

      <!-- Footer Section -->
      <g transform="translate(0, 660)">
        <line x1="0" y1="0" x2="552" y2="0" stroke="#E5E7EB" stroke-width="1"/>

        <!-- Left: Keywords count -->
        <g transform="translate(0, 20)">
          <text x="0" y="12" class="label">3 keywords to add</text>
          <text x="0" y="32" class="body-small">245/500 keywords (49%)</text>
          <rect x="0" y="40" width="180" height="6" rx="3" fill="#E5E7EB"/>
          <rect x="0" y="40" width="88" height="6" rx="3" fill="#10B981"/>
        </g>

        <!-- Right: Action buttons -->
        <g transform="translate(340, 20)">
          <rect width="80" height="48" rx="12" fill="transparent"/>
          <text x="40" y="30" class="body-large text-secondary" text-anchor="middle">Cancel</text>

          <rect x="92" y="0" width="120" height="48" rx="12" fill="#FF5722"/>
          <text x="152" y="30" class="label text-white" text-anchor="middle">Add Keywords</text>
        </g>
      </g>
    </g>
  </g>
</svg>
