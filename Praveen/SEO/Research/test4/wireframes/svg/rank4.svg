<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .display-large { font-family: 'Inter', sans-serif; font-size: 57px; line-height: 64px; font-weight: 600; fill: #111827; }
      .display-small { font-family: 'Inter', sans-serif; font-size: 36px; line-height: 44px; font-weight: 600; fill: #111827; }
      .headline { font-family: 'Inter', sans-serif; font-size: 32px; line-height: 40px; font-weight: 600; fill: #111827; }
      .title { font-family: 'Inter', sans-serif; font-size: 22px; line-height: 28px; font-weight: 600; fill: #111827; }
      .body-large { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 24px; font-weight: 400; fill: #111827; }
      .body-small { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 400; fill: #6B7280; }
      .label { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; fill: #111827; }
      .text-white { fill: #FFFFFF; }
      .text-brand { fill: #FF5722; }
      .text-secondary { fill: #6B7280; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#FFFFFF"/>

  <!-- Sidebar (240px) -->
  <rect x="0" y="0" width="240" height="900" fill="#1F2937"/>

  <!-- Logo Area -->
  <rect x="24" y="24" width="40" height="40" rx="8" fill="#FF5722"/>
  <text x="72" y="52" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">ToolDash</text>

  <!-- Sidebar Menu Items -->
  <g id="sidebar-menu">
    <!-- Dashboard -->
    <rect x="24" y="100" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="126" class="body-small text-white">📊 Dashboard</text>

    <!-- Keyword Rankings (ACTIVE) -->
    <rect x="24" y="152" width="192" height="44" rx="8" fill="#374151"/>
    <text x="48" y="178" class="label text-white">📈 Keyword Rankings</text>

    <!-- Competitors -->
    <rect x="24" y="204" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="230" class="body-small text-white">🎯 Competitors</text>

    <!-- Reports -->
    <rect x="24" y="256" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="282" class="body-small text-white">📄 Reports</text>

    <!-- Settings -->
    <rect x="24" y="308" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="334" class="body-small text-white">⚙️ Settings</text>
  </g>

  <!-- Main Content Area -->
  <g id="main-content">
    <!-- Header (64px) -->
    <rect x="240" y="0" width="1200" height="64" fill="#FFFFFF"/>
    <line x1="240" y1="64" x2="1440" y2="64" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Page Title -->
    <text x="272" y="44" class="headline">Keyword Rankings</text>

    <!-- Header Actions -->
    <!-- Export Button -->
    <rect x="1160" y="20" width="90" height="40" rx="12" fill="transparent" stroke="#E5E7EB" stroke-width="1"/>
    <text x="1185" y="45" class="label">Export</text>

    <!-- Add Keywords Button -->
    <rect x="1262" y="20" width="146" height="40" rx="12" fill="#FF5722"/>
    <text x="1290" y="45" class="label text-white">+ Add Keywords</text>

    <!-- User Avatar -->
    <circle cx="1412" cy="40" r="18" fill="#E5E7EB"/>
    <text x="1405" y="46" class="label text-secondary">U</text>

    <!-- Filters Bar -->
    <rect x="240" y="64" width="1200" height="80" fill="#F9FAFB"/>
    <line x1="240" y1="144" x2="1440" y2="144" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Filter Controls -->
    <g id="filters" transform="translate(272, 88)">
      <!-- Market Dropdown -->
      <rect x="0" y="0" width="160" height="40" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="16" y="25" class="body-small">🇺🇸 United States</text>

      <!-- Platform Segmented Control -->
      <rect x="176" y="0" width="200" height="40" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <rect x="180" y="4" width="64" height="32" rx="8" fill="#FF5722"/>
      <text x="202" y="25" class="body-small text-white">iOS</text>
      <text x="258" y="25" class="body-small">Android</text>
      <text x="338" y="25" class="body-small">Both</text>

      <!-- Date Range -->
      <rect x="392" y="0" width="140" height="40" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="408" y="25" class="body-small">Last 30 days</text>

      <!-- Keyword Type -->
      <rect x="548" y="0" width="130" height="40" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="564" y="25" class="body-small">All types</text>

      <!-- Rank Range -->
      <rect x="694" y="0" width="120" height="40" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="710" y="25" class="body-small">All ranks</text>

      <!-- Clear Filters -->
      <text x="1030" y="25" class="body-small text-brand" text-decoration="underline">Clear filters</text>
    </g>

    <!-- View Toggle -->
    <g id="view-toggle" transform="translate(272, 168)">
      <rect x="0" y="0" width="140" height="40" rx="12" fill="#F3F4F6"/>
      <rect x="4" y="4" width="66" height="32" rx="8" fill="#FFFFFF"/>
      <text x="22" y="27" class="label">Table</text>
      <text x="86" y="27" class="body-small text-secondary">Chart</text>

      <!-- Stats -->
      <text x="1104" y="27" class="body-small text-secondary" text-anchor="end">Showing 1-50 of 245 keywords</text>
    </g>

    <!-- Data Table Card -->
    <rect x="272" y="232" width="1136" height="540" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Table Header -->
    <rect x="272" y="232" width="1136" height="48" rx="16" fill="#F9FAFB"/>
    <line x1="272" y1="280" x2="1408" y2="280" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Header Cells -->
    <g id="table-header">
      <rect x="296" y="248" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="332" y="260" class="body-small text-secondary">⭐</text>
      <text x="364" y="260" class="body-small text-secondary">Keyword</text>
      <text x="604" y="260" class="body-small text-secondary">Current Rank</text>
      <text x="712" y="260" class="body-small text-secondary">Change</text>
      <text x="792" y="260" class="body-small text-secondary">Best</text>
      <text x="852" y="260" class="body-small text-secondary">Worst</text>
      <text x="916" y="260" class="body-small text-secondary">Avg</text>
      <text x="984" y="260" class="body-small text-secondary">Volume</text>
      <text x="1064" y="260" class="body-small text-secondary">Difficulty</text>
      <text x="1164" y="260" class="body-small text-secondary">Est. Downloads</text>
      <text x="1272" y="260" class="body-small text-secondary">Type</text>
      <text x="1328" y="260" class="body-small text-secondary">Updated</text>
    </g>

    <!-- Table Row 1 -->
    <g id="row-1">
      <rect x="272" y="280" width="1136" height="56" fill="#FFFFFF"/>
      <line x1="272" y1="336" x2="1408" y2="336" stroke="#E5E7EB" stroke-width="1"/>

      <rect x="296" y="298" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="332" y="314" class="body-large">⭐</text>
      <text x="364" y="314" class="body-large" font-weight="500">app store optimization</text>

      <rect x="604" y="296" width="40" height="24" rx="12" fill="#DBEAFE"/>
      <text x="618" y="313" class="body-small" font-weight="600" fill="#1E40AF">#12</text>

      <text x="712" y="314" class="body-small text-brand" font-weight="600">↑3</text>
      <text x="792" y="314" class="body-small">#8</text>
      <text x="852" y="314" class="body-small">#18</text>
      <text x="916" y="314" class="body-small">#13.2</text>
      <text x="984" y="314" class="body-small">18.5K</text>

      <rect x="1064" y="300" width="80" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="1064" y="300" width="54" height="8" rx="4" fill="#FF5722"/>
      <text x="1064" y="320" class="body-small text-secondary">68</text>

      <text x="1164" y="314" class="body-small text-brand" font-weight="500">2.8K ↑</text>
      <text x="1272" y="314" class="body-small text-secondary">Generic</text>
      <text x="1328" y="314" class="body-small text-secondary">2h ago</text>
    </g>

    <!-- Table Row 2 -->
    <g id="row-2">
      <rect x="272" y="336" width="1136" height="56" fill="#FFFFFF"/>
      <line x1="272" y1="392" x2="1408" y2="392" stroke="#E5E7EB" stroke-width="1"/>

      <rect x="296" y="354" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="332" y="370" class="body-large">☆</text>
      <text x="364" y="370" class="body-large" font-weight="500">aso tool</text>

      <rect x="604" y="352" width="40" height="24" rx="12" fill="#DBEAFE"/>
      <text x="621" y="369" class="body-small" font-weight="600" fill="#1E40AF">#8</text>

      <text x="712" y="370" class="body-small text-brand" font-weight="600">↑5</text>
      <text x="792" y="370" class="body-small">#5</text>
      <text x="852" y="370" class="body-small">#15</text>
      <text x="916" y="370" class="body-small">#10.1</text>
      <text x="984" y="370" class="body-small">8.2K</text>

      <rect x="1064" y="356" width="80" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="1064" y="356" width="58" height="8" rx="4" fill="#FF5722"/>
      <text x="1064" y="376" class="body-small text-secondary">72</text>

      <text x="1164" y="370" class="body-small text-brand" font-weight="500">1.2K ↑</text>
      <text x="1272" y="370" class="body-small text-secondary">Generic</text>
      <text x="1328" y="370" class="body-small text-secondary">2h ago</text>
    </g>

    <!-- Table Row 3 -->
    <g id="row-3">
      <rect x="272" y="392" width="1136" height="56" fill="#FFFFFF"/>
      <line x1="272" y1="448" x2="1408" y2="448" stroke="#E5E7EB" stroke-width="1"/>

      <rect x="296" y="410" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="332" y="426" class="body-large">☆</text>
      <text x="364" y="426" class="body-large" font-weight="500">keyword tracker</text>

      <rect x="604" y="408" width="40" height="24" rx="12" fill="#FEF3C7"/>
      <text x="614" y="425" class="body-small" font-weight="600" fill="#92400E">#47</text>

      <text x="712" y="426" class="body-small" font-weight="600" fill="#DC2626">↓2</text>
      <text x="792" y="426" class="body-small">#35</text>
      <text x="852" y="426" class="body-small">#89</text>
      <text x="916" y="426" class="body-small">#52.3</text>
      <text x="984" y="426" class="body-small">12.1K</text>

      <rect x="1064" y="412" width="80" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="1064" y="412" width="52" height="8" rx="4" fill="#FF5722"/>
      <text x="1064" y="432" class="body-small text-secondary">65</text>

      <text x="1164" y="426" class="body-small" font-weight="500" fill="#DC2626">450 ↓</text>
      <text x="1272" y="426" class="body-small text-secondary">Generic</text>
      <text x="1328" y="426" class="body-small text-secondary">3h ago</text>
    </g>

    <!-- Additional rows placeholders -->
    <line x1="272" y1="504" x2="1408" y2="504" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="272" y1="560" x2="1408" y2="560" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="272" y1="616" x2="1408" y2="616" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="272" y1="672" x2="1408" y2="672" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="272" y1="728" x2="1408" y2="728" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Pagination -->
    <g id="pagination" transform="translate(272, 788)">
      <text x="0" y="20" class="body-small text-secondary">Rows per page:</text>
      <rect x="108" y="0" width="60" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="128" y="21" class="body-small">50</text>

      <g transform="translate(928, 0)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="12" y="21" class="body-small text-secondary">«</text>

        <rect x="40" y="0" width="32" height="32" rx="8" fill="#FF5722"/>
        <text x="52" y="21" class="body-small text-white" font-weight="600">1</text>

        <rect x="80" y="0" width="32" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="92" y="21" class="body-small">2</text>

        <rect x="120" y="0" width="32" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="132" y="21" class="body-small">3</text>

        <text x="162" y="21" class="body-small text-secondary">...</text>

        <rect x="180" y="0" width="32" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="192" y="21" class="body-small">5</text>

        <rect x="220" y="0" width="32" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="232" y="21" class="body-small text-secondary">»</text>
      </g>
    </g>

    <!-- Bulk Actions Bar -->
    <rect x="240" y="840" width="1200" height="60" fill="#1F2937"/>
    <line x1="240" y1="840" x2="1440" y2="840" stroke="#374151" stroke-width="1"/>

    <text x="272" y="873" class="label text-white">3 selected</text>

    <g transform="translate(1080, 0)">
      <rect x="0" y="852" width="130" height="36" rx="12" fill="#FFFFFF"/>
      <text x="16" y="875" class="body-small">Add to Group</text>

      <rect x="142" y="852" width="80" height="36" rx="12" fill="#FFFFFF"/>
      <text x="166" y="875" class="body-small">Export</text>

      <rect x="234" y="852" width="80" height="36" rx="12" fill="#DC2626"/>
      <text x="258" y="875" class="body-small text-white" font-weight="600">Delete</text>
    </g>
  </g>
</svg>
