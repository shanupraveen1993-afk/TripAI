<svg width="375" height="812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .display-large { font-family: 'Inter', sans-serif; font-size: 57px; line-height: 64px; font-weight: 600; fill: #111827; }
      .display-small { font-family: 'Inter', sans-serif; font-size: 36px; line-height: 44px; font-weight: 600; fill: #111827; }
      .headline { font-family: 'Inter', sans-serif; font-size: 32px; line-height: 40px; font-weight: 600; fill: #111827; }
      .title { font-family: 'Inter', sans-serif; font-size: 22px; line-height: 28px; font-weight: 600; fill: #111827; }
      .body-large { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 24px; font-weight: 400; fill: #111827; }
      .body-small { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 400; fill: #6B7280; }
      .label { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; fill: #111827; }
      .text-white { fill: #FFFFFF; }
      .text-brand { fill: #FF5722; }
      .text-secondary { fill: #6B7280; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#F9FAFB"/>

  <!-- Top App Bar -->
  <g id="app-bar">
    <rect width="375" height="56" fill="#FFFFFF"/>
    <line x1="0" y1="56" x2="375" y2="56" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Hamburger menu -->
    <g transform="translate(16, 18)">
      <rect width="24" height="2" rx="1" fill="#111827"/>
      <rect y="8" width="24" height="2" rx="1" fill="#111827"/>
      <rect y="16" width="24" height="2" rx="1" fill="#111827"/>
    </g>

    <!-- Logo/Title -->
    <text x="187.5" y="35" class="body-large" font-weight="600" text-anchor="middle">Rank Tracker</text>

    <!-- Notification icon -->
    <g transform="translate(311, 16)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#111827" stroke-width="2"/>
      <circle cx="17" cy="7" r="3" fill="#FF5722"/>
    </g>

    <!-- Search icon -->
    <g transform="translate(343, 16)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#111827" stroke-width="2"/>
      <line x1="16" y1="16" x2="22" y2="22" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Main Content -->
  <g id="main-content" transform="translate(0, 56)">

    <!-- App Selector Card (343px wide, 16px padding) -->
    <g id="app-selector" transform="translate(16, 16)">
      <rect x="0" y="0" width="343" height="60" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <g transform="translate(16, 16)">
        <rect x="0" y="-2" width="32" height="32" rx="8" fill="#FF5722"/>
        <text x="44" y="19" class="body-large" font-weight="600">My App Name</text>
      </g>
    </g>

    <!-- KPI Cards Section -->

    <!-- Card 1: Current Avg Rank (343px wide card, 16px padding) -->
    <g id="kpi-card-1" transform="translate(16, 88)">
      <rect x="0" y="0" width="343" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <g transform="translate(16, 16)">
        <text x="0" y="12" class="body-small text-secondary">Current Avg Rank</text>
        <text x="0" y="60" class="display-small text-brand">#12</text>
        <text x="0" y="84" class="body-large" fill="#10B981" font-weight="600">↑ 3 positions</text>
      </g>
    </g>

    <!-- Card 2: Search Visibility (343px wide card, 16px padding) -->
    <g id="kpi-card-2" transform="translate(16, 220)">
      <rect x="0" y="0" width="343" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <g transform="translate(16, 16)">
        <text x="0" y="12" class="body-small text-secondary">Search Visibility Score</text>
        <text x="0" y="56" class="display-small">78</text>
        <text x="78" y="56" class="title text-secondary">/100</text>
        <text x="0" y="80" class="body-large" fill="#10B981" font-weight="600">↑ 5 points</text>
        <!-- 343 - 16 - 16 = 311px inner width -->
        <rect x="0" y="84" width="311" height="8" rx="4" fill="#E5E7EB"/>
        <rect x="0" y="84" width="243" height="8" rx="4" fill="#FF5722"/>
      </g>
    </g>

    <!-- Card 3: Keywords Tracked (343px wide card, 16px padding) -->
    <g id="kpi-card-3" transform="translate(16, 352)">
      <rect x="0" y="0" width="343" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <g transform="translate(16, 16)">
        <text x="0" y="12" class="body-small text-secondary">Keywords Tracked</text>
        <text x="0" y="60" class="display-small">245</text>
        <text x="0" y="84" class="body-large text-secondary">148 in Top 10</text>
      </g>
    </g>

    <!-- Card 4: Est. Organic Downloads (343px wide card, 16px padding) -->
    <g id="kpi-card-4" transform="translate(16, 484)">
      <rect x="0" y="0" width="343" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <g transform="translate(16, 16)">
        <text x="0" y="12" class="body-small text-secondary">Est. Organic Downloads</text>
        <text x="0" y="60" class="display-small">12.5K</text>
        <text x="0" y="84" class="body-large" fill="#10B981" font-weight="600">↑ 18%</text>
      </g>
    </g>

    <!-- Ranking Chart Card (343px wide card, 16px padding) -->
    <g id="chart-card" transform="translate(16, 616)">
      <rect x="0" y="0" width="343" height="280" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <g transform="translate(16, 16)">
        <text x="0" y="8" class="title">Ranking Performance</text>

        <!-- Time selector -->
        <g transform="translate(0, 24)">
          <rect x="0" y="0" width="50" height="32" rx="16" fill="#F9FAFB"/>
          <text x="25" y="21" class="body-small" text-anchor="middle">7D</text>

          <rect x="58" y="0" width="50" height="32" rx="16" fill="#FF5722"/>
          <text x="83" y="21" class="body-small text-white" font-weight="600" text-anchor="middle">30D</text>

          <rect x="116" y="0" width="50" height="32" rx="16" fill="#F9FAFB"/>
          <text x="141" y="21" class="body-small" text-anchor="middle">90D</text>

          <rect x="174" y="0" width="50" height="32" rx="16" fill="#F9FAFB"/>
          <text x="199" y="21" class="body-small" text-anchor="middle">All</text>
        </g>

        <!-- Chart area (311px inner width) -->
        <g transform="translate(0, 73)">
          <!-- Grid lines -->
          <line x1="0" y1="0" x2="311" y2="0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="0" y1="40" x2="311" y2="40" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="0" y1="80" x2="311" y2="80" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="0" y1="120" x2="311" y2="120" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="0" y1="160" x2="311" y2="160" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>

          <!-- Chart line -->
          <path d="M 0,100 L 30,95 L 60,90 L 90,85 L 120,75 L 150,70 L 180,65 L 210,62 L 240,58 L 270,55 L 311,50"
                stroke="#FF5722" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- Data point -->
          <circle cx="311" cy="50" r="5" fill="#FF5722"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="bottom-nav" transform="translate(0, 756)">
    <rect width="375" height="56" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="375" y2="0" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Nav Item 1: Home (Active) -->
    <g transform="translate(37.5, 8)">
      <text x="12" y="26" class="body-small text-brand" text-anchor="middle" font-weight="600">Home</text>
    </g>

    <!-- Nav Item 2: Rankings -->
    <g transform="translate(112.5, 8)">
      <text x="12" y="26" class="body-small text-secondary" text-anchor="middle">Rankings</text>
    </g>

    <!-- Nav Item 3: Add (Center) -->
    <g transform="translate(187.5, 4)">
      <circle cx="0" cy="16" r="20" fill="#FF5722"/>
      <path d="M 0,10 L 0,22 M -6,16 L 6,16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Nav Item 4: Competitors -->
    <g transform="translate(262.5, 8)">
      <text x="12" y="26" class="body-small text-secondary" text-anchor="middle">Competitors</text>
    </g>

    <!-- Nav Item 5: More -->
    <g transform="translate(337.5, 8)">
      <text x="12" y="26" class="body-small text-secondary" text-anchor="middle">More</text>
    </g>
  </g>
</svg>
