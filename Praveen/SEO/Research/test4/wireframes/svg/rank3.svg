<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      text { font-family: 'Inter', sans-serif; }
      .display-small { font-size: 36px; line-height: 44px; font-weight: 600; fill: #111827; }
      .headline { font-size: 32px; line-height: 40px; font-weight: 600; fill: #111827; }
      .title { font-size: 22px; line-height: 28px; font-weight: 600; fill: #111827; }
      .body-large { font-size: 16px; line-height: 24px; font-weight: 400; fill: #111827; }
      .body-small { font-size: 14px; line-height: 20px; font-weight: 400; fill: #6B7280; }
      .label { font-size: 14px; line-height: 20px; font-weight: 600; fill: #111827; }
      .text-white { fill: #FFFFFF; }
      .text-brand { fill: #FF5722; }
      .text-secondary { fill: #6B7280; }
      .text-success { fill: #10B981; }
      .text-error { fill: #DC2626; }
    </style>

    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Sidebar (240px) -->
  <rect width="240" height="900" fill="#FFFFFF"/>

  <!-- Logo area -->
  <g transform="translate(24, 24)">
    <rect width="24" height="24" rx="4" fill="#FF5722"/>
    <text x="32" y="18" class="body-large" font-weight="600">Rank Tracker</text>
  </g>

  <!-- App selector -->
  <rect x="16" y="72" width="208" height="48" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="24" y="100" class="body-large">My App Name</text>
  <path d="M 200 96 L 204 100 L 208 96" stroke="#6B7280" stroke-width="2" fill="none"/>

  <!-- Navigation items -->
  <!-- Dashboard (Active) -->
  <rect x="16" y="144" width="208" height="44" rx="12" fill="#FFF3E0"/>
  <circle cx="32" cy="166" r="8" fill="#FF5722"/>
  <text x="52" y="170" class="label text-brand">Dashboard</text>

  <!-- Keyword Rankings -->
  <rect x="16" y="196" width="208" height="44" rx="12" fill="none"/>
  <path d="M 28 214 L 28 222 L 32 220 L 36 224 L 40 218" stroke="#6B7280" stroke-width="2" fill="none"/>
  <text x="52" y="222" class="label text-secondary">Keyword Rankings</text>

  <!-- Competitors -->
  <rect x="16" y="248" width="208" height="44" rx="12" fill="none"/>
  <circle cx="28" cy="270" r="6" stroke="#6B7280" stroke-width="2" fill="none"/>
  <circle cx="36" cy="270" r="6" stroke="#6B7280" stroke-width="2" fill="none"/>
  <text x="52" y="274" class="label text-secondary">Competitors</text>

  <!-- Reports -->
  <rect x="16" y="300" width="208" height="44" rx="12" fill="none"/>
  <rect x="26" y="268" width="12" height="16" rx="1" stroke="#6B7280" stroke-width="2" fill="none"/>
  <text x="52" y="326" class="label text-secondary">Reports</text>

  <!-- Settings -->
  <rect x="16" y="352" width="208" height="44" rx="12" fill="none"/>
  <circle cx="32" cy="374" r="6" stroke="#6B7280" stroke-width="2" fill="none"/>
  <text x="52" y="378" class="label text-secondary">Settings</text>

  <!-- Help icon at bottom -->
  <circle cx="32" cy="860" r="12" stroke="#6B7280" stroke-width="2" fill="none"/>
  <text x="28" y="866" class="body-small" font-weight="600">?</text>

  <!-- Header -->
  <rect x="240" y="0" width="1200" height="64" fill="#FFFFFF"/>
  <line x1="240" y1="64" x2="1440" y2="64" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Page title -->
  <text x="272" y="42" class="headline">Dashboard</text>

  <!-- Date range selector -->
  <rect x="1024" y="16" width="140" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="1040" y="38" class="body-small" fill="#111827">Last 30 days</text>
  <path d="M 1148 30 L 1152 34 L 1156 30" stroke="#6B7280" stroke-width="2" fill="none"/>

  <!-- Export button -->
  <rect x="1180" y="16" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="1206" y="38" class="label">Export</text>

  <!-- User avatar -->
  <circle cx="1324" cy="32" r="20" fill="#FF5722"/>
  <text x="1314" y="38" class="label text-white">JD</text>

  <!-- Main Content Area -->
  <rect x="240" y="64" width="1200" height="836" fill="#F9FAFB"/>

  <!-- KPI Cards Row -->
  <!-- Card 1: Current Avg Rank -->
  <g id="kpi-card-1" transform="translate(272, 96)">
    <rect x="0" y="0" width="260" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <text x="0" y="8" class="body-small">Current Avg Rank</text>
      <text x="0" y="52" class="display-small">#12</text>
      <text x="0" y="80" class="body-small text-success">↑ 3 positions</text>
      <polyline points="84,90 99,85 114,87 129,83 144,80 159,75 170,73"
                stroke="#10B981" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Card 2: Search Visibility -->
  <g id="kpi-card-2" transform="translate(556, 96)">
    <rect x="0" y="0" width="260" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <text x="0" y="8" class="body-small">Search Visibility Score</text>
      <text x="0" y="52" class="display-small">78/100</text>
      <text x="0" y="80" class="body-small text-success">↑ 5 points</text>
      <rect x="0" y="88" width="212" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="88" width="166" height="8" rx="4" fill="#10B981"/>
    </g>
  </g>

  <!-- Card 3: Keywords Tracked -->
  <g id="kpi-card-3" transform="translate(840, 96)">
    <rect x="0" y="0" width="260" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <text x="0" y="8" class="body-small">Keywords Tracked</text>
      <text x="0" y="52" class="display-small">245</text>
      <text x="0" y="80" class="body-small">148 in Top 10</text>
      <circle cx="160" cy="76" r="20" fill="#E5E7EB"/>
      <path d="M 160 56 A 20 20 0 1 1 160 96 L 160 76 Z" fill="#FF5722"/>
    </g>
  </g>

  <!-- Card 4: Est. Organic Downloads -->
  <g id="kpi-card-4" transform="translate(1124, 96)">
    <rect x="0" y="0" width="268" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <text x="0" y="8" class="body-small">Est. Organic Downloads</text>
      <text x="0" y="52" class="display-small">12.5K</text>
      <text x="0" y="80" class="body-small text-success">↑ 18%</text>
      <path d="M 68 88 L 83 83 L 98 86 L 113 78 L 128 73 L 143 68 L 158 63 L 173 60"
            stroke="#10B981" stroke-width="2" fill="none"/>
      <path d="M 68 88 L 83 83 L 98 86 L 113 78 L 128 73 L 143 68 L 158 63 L 173 60 L 173 97 L 68 97 Z"
            fill="#10B981" opacity="0.2"/>
    </g>
  </g>

  <!-- Add Keyword Button -->
  <rect x="1240" y="252" width="152" height="48" rx="12" fill="#FF5722"/>
  <text x="1268" y="280" class="body-large text-white" font-weight="600">+ Add Keyword</text>

  <!-- Ranking Chart Card -->
  <g id="chart-card" transform="translate(272, 324)">
    <rect x="0" y="0" width="1120" height="444" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <!-- Title and tabs -->
      <text x="0" y="12" class="title">Ranking Performance</text>

      <!-- Tabs -->
      <rect x="872" y="-8" width="40" height="32" rx="8" fill="#F9FAFB"/>
      <text x="884" y="14" class="body-small" fill="#6B7280">7D</text>

      <rect x="924" y="-8" width="48" height="32" rx="8" fill="#FF5722"/>
      <text x="936" y="14" class="label text-white">30D</text>

      <rect x="984" y="-8" width="48" height="32" rx="8" fill="#F9FAFB"/>
      <text x="996" y="14" class="body-small" fill="#6B7280">90D</text>

      <rect x="1044" y="-8" width="36" height="32" rx="8" fill="#F9FAFB"/>
      <text x="1052" y="14" class="body-small" fill="#6B7280">All</text>

      <!-- Chart area -->
      <rect x="0" y="44" width="1072" height="348" fill="#FAFAFA" rx="8"/>

      <!-- Y-axis labels (inverted - #1 at top) -->
      <text x="28" y="72" class="body-small">#1</text>
      <text x="20" y="144" class="body-small">#10</text>
      <text x="20" y="216" class="body-small">#20</text>
      <text x="20" y="288" class="body-small">#30</text>
      <text x="20" y="360" class="body-small">#40</text>

      <!-- Grid lines -->
      <line x1="64" y1="68" x2="1048" y2="68" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="64" y1="140" x2="1048" y2="140" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="64" y1="212" x2="1048" y2="212" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="64" y1="284" x2="1048" y2="284" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="64" y1="356" x2="1048" y2="356" stroke="#E5E7EB" stroke-width="1"/>

      <!-- Chart line 1 (main keyword) -->
      <path d="M 84 212 L 204 192 L 324 152 L 444 172 L 564 132 L 684 112 L 804 92 L 924 72 L 1028 92"
            stroke="#FF5722" stroke-width="3" fill="none"/>
      <path d="M 84 212 L 204 192 L 324 152 L 444 172 L 564 132 L 684 112 L 804 92 L 924 72 L 1028 92 L 1028 376 L 84 376 Z"
            fill="url(#chartGradient)"/>

      <!-- Chart line 2 -->
      <path d="M 84 252 L 204 272 L 324 232 L 444 252 L 564 212 L 684 192 L 804 172 L 924 152 L 1028 132"
            stroke="#3B82F6" stroke-width="2.5" fill="none"/>

      <!-- Chart line 3 -->
      <path d="M 84 292 L 204 312 L 324 272 L 444 292 L 564 252 L 684 272 L 804 232 L 924 212 L 1028 192"
            stroke="#10B981" stroke-width="2.5" fill="none"/>

      <!-- Data points -->
      <circle cx="1028" cy="92" r="4" fill="#FF5722"/>
      <circle cx="1028" cy="132" r="4" fill="#3B82F6"/>
      <circle cx="1028" cy="192" r="4" fill="#10B981"/>

      <!-- Legend -->
      <g transform="translate(0, 400)">
        <circle cx="8" cy="0" r="5" fill="#FF5722"/>
        <text x="20" y="4" class="body-small" fill="#111827">best productivity app</text>

        <circle cx="180" cy="0" r="5" fill="#3B82F6"/>
        <text x="192" y="4" class="body-small" fill="#111827">task manager app</text>

        <circle cx="340" cy="0" r="5" fill="#10B981"/>
        <text x="352" y="4" class="body-small" fill="#111827">to do list app</text>
      </g>
    </g>
  </g>

  <!-- Bottom Row: Recent Changes Card -->
  <g id="recent-changes-card" transform="translate(272, 792)">
    <rect x="0" y="0" width="536" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <text x="0" y="8" class="body-large" font-weight="600">Recent Changes</text>

      <!-- Change item 1 -->
      <circle cx="12" cy="40" r="6" fill="#10B981"/>
      <text x="32" y="44" class="body-small" fill="#111827">Keyword moved from #15 to #12</text>
      <text x="428" y="44" class="body-small">3h ago</text>

      <!-- Change item 2 -->
      <circle cx="12" cy="68" r="6" fill="#3B82F6"/>
      <text x="32" y="72" class="body-small" fill="#111827">Competitor updated metadata</text>
      <text x="428" y="72" class="body-small">5h ago</text>

      <!-- Change item 3 -->
      <circle cx="12" cy="96" r="6" fill="#FF5722"/>
      <text x="32" y="100" class="body-small" fill="#111827">New keyword entered Top 50</text>
      <text x="428" y="100" class="body-small">1d ago</text>
    </g>
  </g>

  <!-- Top Keywords Card -->
  <g id="top-keywords-card" transform="translate(832, 792)">
    <rect x="0" y="0" width="560" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <text x="0" y="8" class="body-large" font-weight="600">Top Keywords</text>

      <!-- Table headers -->
      <text x="0" y="32" class="body-small" font-weight="600">KEYWORD</text>
      <text x="224" y="32" class="body-small" font-weight="600">RANK</text>
      <text x="304" y="32" class="body-small" font-weight="600">CHANGE</text>
      <text x="424" y="32" class="body-small" font-weight="600">VOLUME</text>

      <!-- Row 1 -->
      <text x="0" y="56" class="body-small" fill="#111827">productivity app</text>
      <text x="224" y="56" class="body-small" fill="#111827" font-weight="600">#8</text>
      <text x="304" y="56" class="body-small text-success">↑ 2</text>
      <text x="424" y="56" class="body-small" fill="#111827">12.5K</text>

      <!-- Row 2 -->
      <text x="0" y="80" class="body-small" fill="#111827">task manager</text>
      <text x="224" y="80" class="body-small" fill="#111827" font-weight="600">#12</text>
      <text x="304" y="80" class="body-small text-success">↑ 5</text>
      <text x="424" y="80" class="body-small" fill="#111827">8.3K</text>

      <!-- Row 3 -->
      <text x="0" y="104" class="body-small" fill="#111827">to do list</text>
      <text x="224" y="104" class="body-small" fill="#111827" font-weight="600">#15</text>
      <text x="304" y="104" class="body-small text-error">↓ 1</text>
      <text x="424" y="104" class="body-small" fill="#111827">6.1K</text>
    </g>
  </g>

</svg>
