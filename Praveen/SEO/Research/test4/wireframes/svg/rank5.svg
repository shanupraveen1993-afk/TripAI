<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .display-large { font-family: 'Inter', sans-serif; font-size: 57px; line-height: 64px; font-weight: 600; fill: #111827; }
      .display-small { font-family: 'Inter', sans-serif; font-size: 36px; line-height: 44px; font-weight: 600; fill: #111827; }
      .headline { font-family: 'Inter', sans-serif; font-size: 32px; line-height: 40px; font-weight: 600; fill: #111827; }
      .title { font-family: 'Inter', sans-serif; font-size: 22px; line-height: 28px; font-weight: 600; fill: #111827; }
      .body-large { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 24px; font-weight: 400; fill: #111827; }
      .body-small { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 400; fill: #6B7280; }
      .label { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; fill: #111827; }
      .text-white { fill: #FFFFFF; }
      .text-brand { fill: #FF5722; }
      .text-secondary { fill: #6B7280; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="900" fill="#1A1D29"/>

  <!-- Logo Area -->
  <rect x="24" y="24" width="32" height="32" rx="8" fill="#FF5722"/>
  <text x="64" y="48" class="body-large text-white" font-weight="bold">ASO Tracker</text>

  <!-- Navigation Items -->
  <g id="nav-dashboard">
    <rect x="24" y="96" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="122" class="body-small text-white">Dashboard</text>
  </g>

  <g id="nav-keywords">
    <rect x="24" y="148" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="174" class="body-small text-white">Keyword Rankings</text>
  </g>

  <g id="nav-competitors">
    <rect x="24" y="200" width="192" height="44" rx="16" fill="#FF5722" opacity="0.2"/>
    <rect x="24" y="200" width="192" height="44" rx="16" fill="#FF5722"/>
    <text x="48" y="226" class="label text-white">Competitors</text>
  </g>

  <g id="nav-reports">
    <rect x="24" y="252" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="278" class="body-small text-white">Reports</text>
  </g>

  <g id="nav-settings">
    <rect x="24" y="304" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="330" class="body-small text-white">Settings</text>
  </g>

  <!-- Header -->
  <rect x="240" y="0" width="1200" height="64" fill="#FFFFFF"/>
  <line x1="240" y1="64" x2="1440" y2="64" stroke="#E5E7EB" stroke-width="1"/>

  <text x="272" y="44" class="headline">Competitor Analysis</text>

  <!-- Add Competitor Button -->
  <rect x="1236" y="20" width="148" height="40" rx="12" fill="#FF5722"/>
  <text x="1264" y="45" class="label text-white">Add Competitor</text>

  <!-- User Avatar -->
  <circle cx="1400" cy="40" r="20" fill="#4F46E5"/>
  <text x="1393" y="46" class="label text-white">JD</text>

  <!-- Main Content Area -->
  <g id="main-content">
    <!-- Competitor Selector Section -->
    <g id="competitor-selector" transform="translate(272, 96)">
      <!-- Your App Card -->
      <rect x="0" y="0" width="280" height="120" rx="16" fill="#FFFFFF" stroke="#FF5722" stroke-width="3"/>
      <g transform="translate(24, 24)">
        <rect x="0" y="0" width="64" height="64" rx="12" fill="#FF5722" opacity="0.1"/>
        <circle cx="32" cy="32" r="20" fill="#FF5722"/>
        <text x="22" y="38" class="body-large text-white" font-weight="bold">M</text>
      </g>
      <text x="104" y="52" class="body-large" font-weight="600">My App Name</text>
      <text x="104" y="72" class="body-small">Your Rankings</text>

      <!-- VS Icon -->
      <circle cx="320" cy="60" r="24" fill="#E5E7EB"/>
      <text x="307" class="label text-secondary" y="68">VS</text>

      <!-- Competitor 1 Card -->
      <rect x="368" y="0" width="280" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <g transform="translate(392, 24)">
        <rect x="0" y="0" width="64" height="64" rx="12" fill="#3B82F6" opacity="0.1"/>
        <circle cx="32" cy="32" r="20" fill="#3B82F6"/>
        <text x="22" y="38" class="body-large text-white" font-weight="bold">A</text>
      </g>
      <text x="472" y="52" class="body-large" font-weight="600">AppTweak</text>
      <text x="472" y="72" class="body-small text-brand" text-decoration="underline">Add competitor</text>

      <!-- VS Icon 2 -->
      <circle cx="688" cy="60" r="24" fill="#E5E7EB"/>
      <text x="675" y="68" class="label text-secondary">VS</text>

      <!-- Competitor 2 Card -->
      <rect x="736" y="0" width="280" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <g transform="translate(760, 24)">
        <rect x="0" y="0" width="64" height="64" rx="12" fill="#8B5CF6" opacity="0.1"/>
        <circle cx="32" cy="32" r="20" fill="#8B5CF6"/>
        <text x="22" y="38" class="body-large text-white" font-weight="bold">M</text>
      </g>
      <text x="840" y="52" class="body-large" font-weight="600">Mobile Action</text>
      <text x="840" y="72" class="body-small text-brand" text-decoration="underline">Add competitor</text>
    </g>

    <!-- Comparison Metrics Cards -->
    <g id="metrics-cards" transform="translate(272, 248)">
      <!-- Card 1: Average Rank -->
      <rect x="0" y="0" width="333" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="24" y="40" class="label text-secondary">Average Rank</text>
      <text x="24" y="88" class="display-small text-brand">#12</text>
      <text x="24" y="112" class="body-small">Your App</text>
      <text x="160" y="88" class="title text-secondary">#8</text>
      <text x="160" y="104" class="body-small">Comp 1</text>
      <text x="240" y="88" class="title text-secondary">#15</text>
      <text x="240" y="104" class="body-small">Comp 2</text>

      <!-- Card 2: Keywords Tracked -->
      <rect x="349" y="0" width="333" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="373" y="40" class="label text-secondary">Keywords Tracked</text>
      <text x="373" y="88" class="display-small text-brand">245</text>
      <text x="373" y="112" class="body-small">Your App</text>
      <text x="509" y="88" class="title text-secondary">312</text>
      <text x="509" y="104" class="body-small">Comp 1</text>
      <text x="589" y="88" class="title text-secondary">97</text>
      <text x="589" y="104" class="body-small">Comp 2</text>

      <!-- Card 3: Top 10 Keywords -->
      <rect x="698" y="0" width="333" height="140" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="722" y="40" class="label text-secondary">Top 10 Keywords</text>
      <text x="722" y="88" class="display-small text-brand">148</text>
      <text x="722" y="112" class="body-small">Your App</text>
      <text x="858" y="88" class="title text-secondary">203</text>
      <text x="858" y="104" class="body-small">Comp 1</text>
      <text x="938" y="88" class="title text-secondary">97</text>
      <text x="938" y="104" class="body-small">Comp 2</text>
    </g>

    <!-- Shared Keywords Table -->
    <g id="keywords-table" transform="translate(272, 420)">
      <rect x="0" y="0" width="1136" height="380" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

      <!-- Table Header -->
      <text x="24" y="48" class="title">Shared Keywords Comparison</text>
      <text x="24" y="72" class="body-small">Showing keywords all 3 apps rank for</text>

      <!-- Column Headers -->
      <rect x="24" y="88" width="1088" height="40" fill="#F9FAFB"/>
      <text x="40" y="113" class="label text-secondary">Keyword</text>
      <text x="420" y="113" class="label text-secondary">Your Rank</text>
      <text x="560" y="113" class="label text-secondary">Competitor 1</text>
      <text x="720" y="113" class="label text-secondary">Competitor 2</text>
      <text x="880" y="113" class="label text-secondary">Gap</text>

      <!-- Row 1 -->
      <line x1="24" y1="128" x2="1112" y2="128" stroke="#E5E7EB" stroke-width="1"/>
      <text x="40" y="155" class="body-large">app store optimization</text>
      <text x="440" y="155" class="body-large" font-weight="600">#12</text>
      <rect x="560" y="137" width="60" height="28" rx="8" fill="#D1FAE5"/>
      <text x="578" y="155" class="body-large" font-weight="600" fill="#10B981">#5</text>
      <text x="740" y="155" class="body-large" font-weight="600">#18</text>
      <text x="900" y="155" class="body-large" font-weight="600" fill="#DC2626">-7</text>

      <!-- Row 2 -->
      <line x1="24" y1="176" x2="1112" y2="176" stroke="#E5E7EB" stroke-width="1"/>
      <text x="40" y="203" class="body-large">aso tool</text>
      <rect x="420" y="185" width="60" height="28" rx="8" fill="#D1FAE5"/>
      <text x="438" y="203" class="body-large" font-weight="600" fill="#10B981">#8</text>
      <text x="578" y="203" class="body-large" font-weight="600">#12</text>
      <text x="740" y="203" class="body-large" font-weight="600">#25</text>
      <text x="900" y="203" class="body-large" font-weight="600" fill="#10B981">+4</text>

      <!-- Row 3 -->
      <line x1="24" y1="224" x2="1112" y2="224" stroke="#E5E7EB" stroke-width="1"/>
      <text x="40" y="251" class="body-large">keyword research</text>
      <text x="440" y="251" class="body-large" font-weight="600">#25</text>
      <rect x="560" y="233" width="60" height="28" rx="8" fill="#D1FAE5"/>
      <text x="576" y="251" class="body-large" font-weight="600" fill="#10B981">#15</text>
      <text x="740" y="251" class="body-large" font-weight="600">#32</text>
      <text x="897" y="251" class="body-large" font-weight="600" fill="#DC2626">-10</text>

      <!-- Row 4 -->
      <line x1="24" y1="272" x2="1112" y2="272" stroke="#E5E7EB" stroke-width="1"/>
      <text x="40" y="299" class="body-large">app marketing</text>
      <text x="440" y="299" class="body-large" font-weight="600">#47</text>
      <rect x="560" y="281" width="60" height="28" rx="8" fill="#D1FAE5"/>
      <text x="576" y="299" class="body-large" font-weight="600" fill="#10B981">#28</text>
      <text x="740" y="299" class="body-large" font-weight="600">#51</text>
      <text x="897" y="299" class="body-large" font-weight="600" fill="#DC2626">-19</text>

      <!-- Row 5 -->
      <line x1="24" y1="320" x2="1112" y2="320" stroke="#E5E7EB" stroke-width="1"/>
      <text x="40" y="347" class="body-large">rank tracker</text>
      <text x="440" y="347" class="body-large" font-weight="600">#18</text>
      <rect x="560" y="329" width="60" height="28" rx="8" fill="#D1FAE5"/>
      <text x="578" y="347" class="body-large" font-weight="600" fill="#10B981">#8</text>
      <text x="740" y="347" class="body-large" font-weight="600">#22</text>
      <text x="897" y="347" class="body-large" font-weight="600" fill="#DC2626">-10</text>
    </g>
  </g>

  <!-- Scroll Indicator -->
  <g transform="translate(1420, 850)">
    <circle cx="0" cy="0" r="8" fill="#9CA3AF" opacity="0.5"/>
    <path d="M -3,-2 L 0,2 L 3,-2" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
