<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .display-large { font-family: 'Inter', sans-serif; font-size: 57px; line-height: 64px; font-weight: 600; fill: #111827; }
      .display-small { font-family: 'Inter', sans-serif; font-size: 36px; line-height: 44px; font-weight: 600; fill: #111827; }
      .headline { font-family: 'Inter', sans-serif; font-size: 32px; line-height: 40px; font-weight: 600; fill: #111827; }
      .title { font-family: 'Inter', sans-serif; font-size: 22px; line-height: 28px; font-weight: 600; fill: #111827; }
      .body-large { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 24px; font-weight: 400; fill: #111827; }
      .body-small { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 400; fill: #6B7280; }
      .label { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; fill: #111827; }
      .text-white { fill: #FFFFFF; }
      .text-brand { fill: #FF5722; }
      .text-secondary { fill: #6B7280; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Sidebar (240px width) -->
  <rect x="0" y="0" width="240" height="900" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Sidebar Logo Area -->
  <rect x="24" y="24" width="192" height="40" rx="8" fill="#E5E7EB"/>
  <text x="120" y="50" class="body-large" text-anchor="middle">Logo</text>

  <!-- Sidebar Menu Items -->
  <g>
    <rect x="24" y="88" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="114" class="body-small">Dashboard</text>
  </g>

  <g>
    <rect x="24" y="140" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="166" class="body-small">Keyword Rankings</text>
  </g>

  <g>
    <rect x="24" y="192" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="218" class="body-small">Competitors</text>
  </g>

  <g>
    <rect x="24" y="244" width="192" height="44" rx="8" fill="transparent"/>
    <text x="48" y="270" class="body-small">Reports</text>
  </g>

  <!-- Settings (ACTIVE) -->
  <g>
    <rect x="24" y="296" width="192" height="44" rx="8" fill="#FFF3E0"/>
    <text x="48" y="322" class="label text-brand">Settings</text>
  </g>

  <!-- Header (64px height) -->
  <rect x="240" y="0" width="1200" height="64" fill="#FFFFFF"/>
  <line x1="240" y1="64" x2="1440" y2="64" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Header Title -->
  <text x="272" y="44" class="headline">Settings</text>

  <!-- Saved Indicator -->
  <g>
    <circle cx="1336" cy="40" r="10" fill="#10B981"/>
    <text x="1354" y="45" class="body-small text-brand">Saved</text>
  </g>

  <!-- User Avatar -->
  <circle cx="1404" cy="40" r="20" fill="#FF5722"/>
  <text x="1404" y="46" class="label text-white" text-anchor="middle">JD</text>

  <!-- Tab Navigation -->
  <g>
    <!-- Account (ACTIVE) -->
    <text x="272" y="106" class="label text-brand">Account</text>
    <line x1="272" y1="116" x2="332" y2="116" stroke="#FF5722" stroke-width="4"/>

    <!-- Preferences -->
    <text x="372" y="106" class="label text-secondary">Preferences</text>

    <!-- Integrations -->
    <text x="492" y="106" class="label text-secondary">Integrations</text>

    <!-- Notifications -->
    <text x="612" y="106" class="label text-secondary">Notifications</text>

    <!-- Billing -->
    <text x="752" y="106" class="label text-secondary">Billing</text>
  </g>

  <line x1="240" y1="124" x2="1440" y2="124" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Main Content Area -->
  <!-- Profile Section Card (1096px width, 24px padding = 1048px inner) -->
  <g id="profile-section" transform="translate(296, 156)">
    <rect x="0" y="0" width="1096" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <!-- Section Title -->
      <text x="0" y="16" class="title">Profile</text>

      <!-- Avatar Section (centered in 120px column) -->
      <g transform="translate(0, 48)">
        <circle cx="60" cy="58" r="40" fill="#FF5722"/>
        <text x="60" y="66" class="title text-white" text-anchor="middle">JD</text>
        <text x="60" y="118" class="body-small text-brand" text-anchor="middle">Change photo</text>
      </g>

      <!-- Form Fields (starts at x=144, width=904) -->
      <g transform="translate(144, 48)">
        <!-- Full Name -->
        <text x="0" y="12" class="label">Full name</text>
        <rect x="0" y="20" width="904" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="54" class="body-large">John Doe</text>

        <!-- Email -->
        <text x="0" y="104" class="label">Email</text>
        <rect x="0" y="112" width="904" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="146" class="body-large text-secondary">john@example.com</text>
        <rect x="808" y="128" width="72" height="24" rx="12" fill="#E8F5E9"/>
        <text x="844" y="144" class="body-small" fill="#10B981" text-anchor="middle" font-weight="bold">Verified ✓</text>

        <!-- Phone -->
        <text x="0" y="196" class="label">Phone <tspan fill="#9CA3AF" font-weight="normal">(optional)</tspan></text>
        <rect x="0" y="204" width="904" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="238" class="body-large">+1 (555) 123-4567</text>
      </g>
    </g>
  </g>

  <!-- Password &amp; Security Section Card -->
  <g>
    <rect x="296" y="540" width="1096" height="180" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Section Title -->
    <text x="320" y="580" class="title">Password &amp; Security</text>

    <!-- Current Password -->
    <text x="320" y="614" class="label">Current password</text>
    <rect x="320" y="622" width="400" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="344" y="656" class="body-large text-secondary">••••••••</text>
    <text x="740" y="656" class="body-small text-brand">Change password</text>

    <!-- Two-Factor Authentication -->
    <text x="880" y="614" class="label">Two-Factor Authentication</text>
    <rect x="880" y="630" width="88" height="28" rx="14" fill="#E8F5E9"/>
    <text x="924" y="649" class="body-small" fill="#10B981" font-weight="bold" text-anchor="middle">Enabled ✓</text>
    <text x="880" y="677" class="body-small">Disable 2FA</text>
  </g>

  <!-- Account Actions Section Card -->
  <g>
    <rect x="296" y="744" width="1096" height="132" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Section Title -->
    <text x="320" y="784" class="title">Account Management</text>

    <!-- Log out button -->
    <rect x="320" y="802" width="240" height="44" rx="12" fill="transparent" stroke="#E5E7EB" stroke-width="2"/>
    <text x="440" y="829" class="label text-secondary" text-anchor="middle">Log out from all devices</text>

    <!-- Delete account link -->
    <text x="320" y="868" class="body-small" fill="#DC2626">Delete account</text>
  </g>
</svg>
