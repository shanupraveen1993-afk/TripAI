<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .display-large { font-family: 'Inter', sans-serif; font-size: 57px; line-height: 64px; font-weight: 600; fill: #111827; }
      .display-small { font-family: 'Inter', sans-serif; font-size: 36px; line-height: 44px; font-weight: 600; fill: #111827; }
      .headline { font-family: 'Inter', sans-serif; font-size: 32px; line-height: 40px; font-weight: 600; fill: #111827; }
      .title { font-family: 'Inter', sans-serif; font-size: 22px; line-height: 28px; font-weight: 600; fill: #111827; }
      .body-large { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 24px; font-weight: 400; fill: #111827; }
      .body-small { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 400; fill: #6B7280; }
      .label { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; fill: #111827; }
      .text-white { fill: #FFFFFF; }
      .text-brand { fill: #FF5722; }
      .text-secondary { fill: #6B7280; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Sidebar (240px) -->
  <rect width="240" height="900" fill="#1A1A2E"/>

  <!-- Logo Area -->
  <rect x="24" y="24" width="40" height="40" rx="8" fill="#FF5722"/>
  <text x="76" y="52" class="body-large text-white" font-weight="bold">SEO Pro</text>

  <!-- Sidebar Menu Items -->
  <g id="menu-items">
    <g opacity="0.7">
      <rect x="24" y="100" width="192" height="44" rx="8" fill="transparent"/>
      <text x="48" y="126" class="body-small text-white">Dashboard</text>
    </g>

    <g>
      <rect x="24" y="152" width="192" height="44" rx="8" fill="#FF5722"/>
      <text x="48" y="178" class="label text-white">Keyword Rankings</text>
    </g>

    <g opacity="0.7">
      <rect x="24" y="204" width="192" height="44" rx="8" fill="transparent"/>
      <text x="48" y="230" class="body-small text-white">Competitors</text>
    </g>

    <g opacity="0.7">
      <rect x="24" y="256" width="192" height="44" rx="8" fill="transparent"/>
      <text x="48" y="282" class="body-small text-white">Reports</text>
    </g>

    <g opacity="0.7">
      <rect x="24" y="308" width="192" height="44" rx="8" fill="transparent"/>
      <text x="48" y="334" class="body-small text-white">Settings</text>
    </g>
  </g>

  <!-- Main Content Area -->
  <g id="main-content">
    <!-- Header (64px) -->
    <rect x="240" y="0" width="1200" height="64" fill="#FFFFFF"/>
    <line x1="240" y1="64" x2="1440" y2="64" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Breadcrumb -->
    <text x="272" y="32" class="body-small text-secondary">← Back to Keywords</text>

    <!-- Title -->
    <text x="272" y="56" class="title">app store optimization</text>
    <text x="530" y="56" font-size="20" fill="#FFB300">⭐</text>

    <!-- Actions -->
    <circle cx="1350" cy="40" r="20" fill="#E5E7EB"/>
    <circle cx="1400" cy="40" r="20" fill="#FF5722"/>
    <text x="1393" y="46" class="label text-white">P</text>

    <!-- Quick Metrics Bar -->
    <g id="metrics-bar" transform="translate(272, 96)">
      <!-- Current Rank -->
      <rect width="180" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="24" y="36" class="body-small">Current Rank</text>
      <text x="24" y="70" class="display-small">#12</text>
      <text x="80" y="70" class="body-large text-brand" font-weight="600">↑3</text>

      <!-- Best Rank -->
      <g transform="translate(196, 0)">
        <rect width="180" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="36" class="body-small">Best Rank</text>
        <text x="24" y="70" class="display-small">#8</text>
        <text x="24" y="92" class="body-small">Dec 15</text>
      </g>

      <!-- Avg Rank -->
      <g transform="translate(392, 0)">
        <rect width="180" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="36" class="body-small">Avg Rank</text>
        <text x="24" y="70" class="display-small">#15.2</text>
        <text x="24" y="92" class="body-small">30 days</text>
      </g>

      <!-- Search Volume -->
      <g transform="translate(588, 0)">
        <rect width="180" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="36" class="body-small">Search Volume</text>
        <text x="24" y="70" class="title">18.5K</text>
        <text x="24" y="92" class="body-small">/mo</text>
      </g>

      <!-- Difficulty -->
      <g transform="translate(784, 0)">
        <rect width="180" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="36" class="body-small">Difficulty</text>
        <text x="24" y="70" class="display-small">68</text>
        <text x="60" y="70" class="body-large text-secondary">/100</text>
        <rect x="24" y="84" width="132" height="8" rx="4" fill="#E5E7EB"/>
        <rect x="24" y="84" width="90" height="8" rx="4" fill="#FF9800"/>
      </g>

      <!-- Est. Downloads -->
      <g transform="translate(980, 0)">
        <rect width="180" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="36" class="body-small">Est. Downloads</text>
        <text x="24" y="70" class="display-small">2.8K</text>
        <text x="24" y="92" class="body-small text-brand" font-weight="600">↑12%</text>
      </g>
    </g>

    <!-- Tab Navigation -->
    <g id="tabs" transform="translate(272, 220)">
      <line x1="0" y1="44" x2="1136" y2="44" stroke="#E5E7EB" stroke-width="1"/>

      <!-- Overview (ACTIVE) -->
      <text x="0" y="28" class="label text-brand">Overview</text>
      <rect x="0" y="40" width="70" height="4" rx="2" fill="#FF5722"/>

      <!-- Ranking History -->
      <text x="110" y="28" class="label text-secondary">Ranking History</text>

      <!-- Competitor Analysis -->
      <text x="260" y="28" class="label text-secondary">Competitor Analysis</text>

      <!-- Optimization Suggestions -->
      <text x="450" y="28" class="label text-secondary">Optimization Suggestions</text>
    </g>

    <!-- Ranking Trend Chart -->
    <g id="ranking-chart" transform="translate(272, 284)">
      <rect width="1136" height="400" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

      <!-- Chart Header -->
      <text x="24" y="48" class="title">Ranking Performance (Last 90 Days)</text>

      <!-- Time Selector -->
      <g transform="translate(920, 24)">
        <rect x="0" y="0" width="40" height="32" rx="8" fill="#F9FAFB"/>
        <text x="12" y="21" class="body-small">7D</text>

        <rect x="48" y="0" width="40" height="32" rx="8" fill="#F9FAFB"/>
        <text x="58" y="21" class="body-small">30D</text>

        <rect x="96" y="0" width="40" height="32" rx="8" fill="#FF5722"/>
        <text x="104" y="21" class="body-small text-white" font-weight="600">90D</text>

        <rect x="144" y="0" width="40" height="32" rx="8" fill="#F9FAFB"/>
        <text x="157" y="21" class="body-small">All</text>
      </g>

      <!-- Chart Area -->
      <g transform="translate(40, 80)">
        <!-- Y-axis labels -->
        <text x="0" y="8" class="body-small">#1</text>
        <text x="0" y="78" class="body-small">#10</text>
        <text x="0" y="148" class="body-small">#20</text>
        <text x="0" y="218" class="body-small">#30</text>
        <text x="0" y="288" class="body-small">#40</text>
        <text x="0" y="320" class="body-small">#50</text>

        <!-- Grid lines -->
        <line x1="40" y1="4" x2="1056" y2="4" stroke="#F9FAFB" stroke-width="1"/>
        <line x1="40" y1="74" x2="1056" y2="74" stroke="#F9FAFB" stroke-width="1"/>
        <line x1="40" y1="144" x2="1056" y2="144" stroke="#F9FAFB" stroke-width="1"/>
        <line x1="40" y1="214" x2="1056" y2="214" stroke="#F9FAFB" stroke-width="1"/>
        <line x1="40" y1="284" x2="1056" y2="284" stroke="#F9FAFB" stroke-width="1"/>
        <line x1="40" y1="320" x2="1056" y2="320" stroke="#F9FAFB" stroke-width="1"/>

        <!-- Chart line -->
        <polyline points="40,220 140,200 240,180 340,160 440,190 540,170 640,150 740,140 840,120 940,100 1040,84"
                  fill="none" stroke="#FF5722" stroke-width="3" stroke-linejoin="round"/>

        <!-- Data point -->
        <circle cx="540" cy="170" r="6" fill="#6B7280"/>
        <line x1="540" y1="170" x2="540" y2="50" stroke="#6B7280" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="470" y="30" width="140" height="28" rx="8" fill="#6B7280"/>
        <text x="480" y="49" class="body-small text-white">Metadata Update</text>
      </g>
    </g>

    <!-- Two-Column Layout -->
    <g id="two-column" transform="translate(272, 716)">
      <!-- Left Column: Keyword Insights -->
      <rect width="548" height="180" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="24" y="48" class="label">Keyword Insights</text>

      <text x="24" y="76" class="body-small">Keyword Type:</text>
      <rect x="120" y="64" width="70" height="24" rx="12" fill="#E3F2FD"/>
      <text x="133" y="79" class="body-small" fill="#1976D2">Generic</text>

      <text x="24" y="104" class="body-small">Relevance Score:</text>
      <rect x="140" y="92" width="50" height="24" rx="12" fill="#E8F5E9"/>
      <text x="153" y="107" class="body-small" fill="#10B981">High</text>

      <text x="24" y="132" class="body-small">Trending:</text>
      <text x="88" y="132" class="body-small text-brand">↑ Growing 15% this month</text>

      <!-- Right Column: Performance Summary -->
      <g transform="translate(572, 0)">
        <rect width="564" height="180" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="24" y="48" class="label">Performance Summary</text>

        <text x="24" y="76" class="body-small">Days in Top 10:</text>
        <text x="120" y="76" class="body-small" font-weight="600">12 of last 30 days</text>
        <rect x="260" y="66" width="280" height="8" rx="4" fill="#E5E7EB"/>
        <rect x="260" y="66" width="112" height="8" rx="4" fill="#FF5722"/>

        <text x="24" y="104" class="body-small">Avg Position Change:</text>
        <text x="170" y="104" class="body-small text-brand" font-weight="600">+2 positions/week</text>

        <text x="24" y="132" class="body-small">Volatility:</text>
        <rect x="94" y="120" width="70" height="24" rx="12" fill="#FFF8E1"/>
        <text x="107" y="135" class="body-small" fill="#F57C00">Medium</text>
      </g>
    </g>
  </g>
</svg>
