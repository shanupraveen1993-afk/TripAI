<svg width="375" height="1200" viewBox="0 0 375 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="375" height="1200" fill="#FFFFFF"/>

  <!-- Mobile Top Navigation -->
  <g id="mobile-nav">
    <rect width="375" height="56" fill="#FFFFFF"/>
    <rect y="56" width="375" height="1" fill="#E0E0E0"/>

    <!-- Hamburger Menu -->
    <g transform="translate(16, 18)">
      <rect width="24" height="2" rx="1" fill="#1A1A1A"/>
      <rect y="8" width="24" height="2" rx="1" fill="#1A1A1A"/>
      <rect y="16" width="24" height="2" rx="1" fill="#1A1A1A"/>
    </g>

    <!-- Logo -->
    <g transform="translate(56, 16)">
      <rect width="24" height="24" rx="6" fill="#FF9800"/>
      <text x="32" y="18" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600" fill="#1A1A1A">SearchVector</text>
    </g>

    <!-- User Avatar -->
    <g transform="translate(335, 16)">
      <circle cx="12" cy="12" r="12" fill="#FF9800"/>
      <text x="9" y="16" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">JD</text>
    </g>
  </g>

  <!-- Page Title & Usage -->
  <g transform="translate(16, 72)">
    <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="600" fill="#1A1A1A">Keyword Research</text>

    <!-- Usage Badge -->
    <g transform="translate(0, 12)">
      <rect width="120" height="20" rx="10" fill="#FFF3E0" stroke="#FFE0B2" stroke-width="1"/>
      <text x="10" y="14" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#F57C00">250/500 keywords</text>
    </g>
  </g>

  <!-- Platform Toggle -->
  <g transform="translate(16, 136)">
    <rect width="160" height="32" rx="16" fill="#F5F5F5"/>
    <rect x="2" y="2" width="76" height="28" rx="14" fill="#FF9800"/>
    <text x="24" y="20" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">iOS</text>
    <text x="98" y="20" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="500" fill="#6D6D6D">Android</text>
  </g>

  <!-- Country Selector -->
  <g transform="translate(188, 136)">
    <rect width="171" height="32" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="10" y="20" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="400" fill="#1A1A1A">🇺🇸 United States</text>
    <path d="M 163 14 L 167 18 L 163 22" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Search Input -->
  <g transform="translate(16, 188)">
    <rect width="343" height="48" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <circle cx="16" cy="24" r="8" stroke="#6D6D6D" stroke-width="2" fill="none"/>
    <line x1="22" y1="30" x2="26" y2="34" stroke="#6D6D6D" stroke-width="2"/>
    <text x="36" y="30" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#1A1A1A">fitness tracker</text>
  </g>

  <!-- Search Button -->
  <g transform="translate(16, 248)">
    <rect width="343" height="44" rx="8" fill="#FF9800"/>
    <text x="135" y="28" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Search Keywords</text>
  </g>

  <!-- Consultation CTA (Compact) -->
  <g transform="translate(16, 308)">
    <rect width="343" height="80" rx="8" fill="url(#gradient-cta-mobile)" stroke="#F4511E" stroke-width="1"/>
    <defs>
      <linearGradient id="gradient-cta-mobile" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#FF5722;stop-opacity:0.1"/>
        <stop offset="100%" style="stop-color:#F4511E;stop-opacity:0.15"/>
      </linearGradient>
    </defs>
    <text x="16" y="24" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Need ASO help?</text>
    <text x="16" y="42" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="400" fill="#4A4A4A">Free consultation available</text>
    <rect x="16" y="52" width="311" height="20" rx="4" fill="#FF5722"/>
    <text x="110" y="66" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Book Free Consultation</text>
  </g>

  <!-- Filter Button & Results Count -->
  <g transform="translate(16, 408)">
    <text x="0" y="18" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">127 keywords found</text>

    <!-- Filter Button -->
    <g transform="translate(240, 0)">
      <rect width="103" height="32" rx="6" fill="#F5F5F5"/>
      <circle cx="16" cy="16" r="6" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
      <rect x="20" y="10" width="2" height="12" fill="#4A4A4A"/>
      <rect x="24" y="10" width="2" height="12" fill="#4A4A4A"/>
      <rect x="28" y="10" width="2" height="12" fill="#4A4A4A"/>
      <text x="40" y="20" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" fill="#4A4A4A">Filter (2)</text>
    </g>
  </g>

  <!-- Active Filters (Horizontal Scroll) -->
  <g transform="translate(16, 456)">
    <!-- Filter Chip 1 -->
    <rect width="120" height="24" rx="12" fill="#FF9800" opacity="0.15"/>
    <text x="10" y="16" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#F57C00">Difficulty: Easy</text>
    <circle cx="108" cy="12" r="6" fill="#F57C00"/>
    <line x1="106" y1="10" x2="110" y2="14" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="110" y1="10" x2="106" y2="14" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Filter Chip 2 -->
    <g transform="translate(132, 0)">
      <rect width="135" height="24" rx="12" fill="#FF9800" opacity="0.15"/>
      <text x="10" y="16" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#F57C00">Volume: 10K-100K</text>
      <circle cx="123" cy="12" r="6" fill="#F57C00"/>
      <line x1="121" y1="10" x2="125" y2="14" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="125" y1="10" x2="121" y2="14" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Keyword Cards (Mobile Card View) -->
  <g transform="translate(16, 500)">
    <!-- Card 1 -->
    <g>
      <rect width="343" height="136" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>

      <!-- Keyword Title -->
      <text x="16" y="24" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">fitness tracker app</text>

      <!-- Metrics Row 1 -->
      <g transform="translate(16, 40)">
        <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">VOLUME</text>
        <text x="0" y="18" font-family="Roboto Mono, monospace" font-size="14" font-weight="600" fill="#1A1A1A">45.2K</text>

        <g transform="translate(100, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">DIFFICULTY</text>
          <rect x="0" y="6" width="60" height="20" rx="10" fill="#E8F5E9"/>
          <text x="13" y="20" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#43A047">Easy 23</text>
        </g>

        <g transform="translate(220, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">TREND</text>
          <text x="0" y="18" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#43A047">↑ 12%</text>
        </g>
      </g>

      <!-- Metrics Row 2 -->
      <g transform="translate(16, 86)">
        <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">OPPORTUNITY</text>
        <rect x="0" y="6" width="50" height="20" rx="10" fill="#E8F5E9"/>
        <text x="12" y="20" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#43A047">High</text>

        <g transform="translate(100, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">CURRENT RANK</text>
          <text x="0" y="18" font-family="Roboto Mono, monospace" font-size="13" font-weight="400" fill="#6D6D6D">-</text>
        </g>
      </g>

      <!-- Save Button -->
      <rect x="263" y="104" width="64" height="24" rx="6" fill="#FF9800"/>
      <text x="278" y="120" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Save</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(0, 148)">
      <rect width="343" height="136" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>

      <text x="16" y="24" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">workout planner</text>

      <g transform="translate(16, 40)">
        <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">VOLUME</text>
        <text x="0" y="18" font-family="Roboto Mono, monospace" font-size="14" font-weight="600" fill="#1A1A1A">128K</text>

        <g transform="translate(100, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">DIFFICULTY</text>
          <rect x="0" y="6" width="75" height="20" rx="10" fill="#FFF3E0"/>
          <text x="8" y="20" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#FB8C00">Medium 67</text>
        </g>

        <g transform="translate(220, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">TREND</text>
          <text x="0" y="18" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#9E9E9E">→ 0%</text>
        </g>
      </g>

      <g transform="translate(16, 86)">
        <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">OPPORTUNITY</text>
        <rect x="0" y="6" width="65" height="20" rx="10" fill="#FFF3E0"/>
        <text x="8" y="20" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#FB8C00">Medium</text>

        <g transform="translate(100, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">CURRENT RANK</text>
          <text x="0" y="18" font-family="Roboto Mono, monospace" font-size="13" font-weight="400" fill="#6D6D6D">#47</text>
        </g>
      </g>

      <rect x="263" y="104" width="64" height="24" rx="6" fill="#FF9800"/>
      <text x="278" y="120" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Save</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 296)">
      <rect width="343" height="136" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>

      <text x="16" y="24" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">calorie counter free</text>

      <g transform="translate(16, 40)">
        <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">VOLUME</text>
        <text x="0" y="18" font-family="Roboto Mono, monospace" font-size="14" font-weight="600" fill="#1A1A1A">89.5K</text>

        <g transform="translate(100, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">DIFFICULTY</text>
          <rect x="0" y="6" width="60" height="20" rx="10" fill="#FFEBEE"/>
          <text x="11" y="20" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#E53935">Hard 89</text>
        </g>

        <g transform="translate(220, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">TREND</text>
          <text x="0" y="18" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#E53935">↓ 5%</text>
        </g>
      </g>

      <g transform="translate(16, 86)">
        <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">OPPORTUNITY</text>
        <rect x="0" y="6" width="45" height="20" rx="10" fill="#F5F5F5"/>
        <text x="12" y="20" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#9E9E9E">Low</text>

        <g transform="translate(100, 0)">
          <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="500" fill="#8A8A8A">CURRENT RANK</text>
          <text x="0" y="18" font-family="Roboto Mono, monospace" font-size="13" font-weight="400" fill="#6D6D6D">#8</text>
        </g>
      </g>

      <rect x="263" y="104" width="64" height="24" rx="6" fill="#FF9800"/>
      <text x="278" y="120" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Save</text>
    </g>
  </g>

  <!-- Load More Button -->
  <g transform="translate(16, 952)">
    <rect width="343" height="40" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <text x="144" y="25" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Load More</text>
  </g>

  <!-- Export & Actions (Bottom Sheet Trigger) -->
  <g transform="translate(16, 1008)">
    <rect width="165" height="36" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="40" y="22" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" fill="#4A4A4A">Export CSV</text>

    <rect x="178" width="165" height="36" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="198" y="22" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" fill="#4A4A4A">Google Sheets</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 1140)">
    <rect width="375" height="60" fill="#FFFFFF"/>
    <rect y="0" width="375" height="1" fill="#E0E0E0"/>

    <!-- Nav Item 1 -->
    <g transform="translate(30, 12)">
      <circle cx="16" cy="16" r="10" fill="#FF9800"/>
      <text x="0" y="42" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="600" fill="#FF9800" text-anchor="middle">Search</text>
    </g>

    <!-- Nav Item 2 -->
    <g transform="translate(110, 12)">
      <circle cx="16" cy="16" r="10" fill="#C6C6C6"/>
      <text x="0" y="42" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="400" fill="#8A8A8A" text-anchor="middle">Saved</text>
    </g>

    <!-- Nav Item 3 -->
    <g transform="translate(190, 12)">
      <circle cx="16" cy="16" r="10" fill="#C6C6C6"/>
      <text x="0" y="42" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="400" fill="#8A8A8A" text-anchor="middle">Analytics</text>
    </g>

    <!-- Nav Item 4 -->
    <g transform="translate(270, 12)">
      <circle cx="16" cy="16" r="10" fill="#C6C6C6"/>
      <text x="0" y="42" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="400" fill="#8A8A8A" text-anchor="middle">More</text>
    </g>
  </g>

  <!-- Help FAB -->
  <g transform="translate(315, 1080)">
    <circle cx="24" cy="24" r="24" fill="#FF9800" style="filter:drop-shadow(0 4px 8px rgba(0,0,0,0.2))"/>
    <text x="19" y="34" font-family="IBM Plex Sans, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">?</text>
  </g>
</svg>