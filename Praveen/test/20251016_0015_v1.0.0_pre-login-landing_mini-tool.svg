      <!-- CTA Button -->
      <rect x="690" y="28" width="180" height="48" rx="8" fill="#FF5722"/>
      <text x="726" y="57" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Create Free Account</text>
