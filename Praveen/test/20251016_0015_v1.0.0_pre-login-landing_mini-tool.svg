        <rect x="0" y="12" width="24" height="28" rx="4" stroke="#FF5722" stroke-width="2" fill="none"/>
        <path d="M 6 12 L 6 8 A 6 6 0 0 1 18 8 L 18 12" stroke="#FF5722" stroke-width="2" fill="none"/>
