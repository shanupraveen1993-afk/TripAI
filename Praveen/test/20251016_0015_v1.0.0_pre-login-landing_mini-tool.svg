        <path d="M 11 16 L 15 20 L 21 12" stroke="#43A047" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="22" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">500 keyword searches per month</text>
      </g>

      <!-- Benefit 2 -->
      <g transform="translate(0, 56)">
        <circle cx="16" cy="16" r="16" fill="#E8F5E9"/>
        <path d="M 11 16 L 15 20 L 21 12" stroke="#43A047" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="22" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">Full keyword metrics & trend data</text>
      </g>

      <!-- Benefit 3 -->
      <g transform="translate(0, 112)">
        <circle cx="16" cy="16" r="16" fill="#E8F5E9"/>
        <path d="M 11 16 L 15 20 L 21 12" stroke="#43A047" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="22" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">Save and organize keyword lists</text>
      </g>

      <!-- Benefit 4 -->
      <g transform="translate(500, 0)">
        <circle cx="16" cy="16" r="16" fill="#E8F5E9"/>
        <path d="M 11 16 L 15 20 L 21 12" stroke="#43A047" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="22" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">Export to CSV & Google Sheets</text>
      </g>

      <!-- Benefit 5 -->
      <g transform="translate(500, 56)">
        <circle cx="16" cy="16" r="16" fill="#E8F5E9"/>
        <path d="M 11 16 L 15 20 L 21 12" stroke="#43A047" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="22" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">Access to competitor analysis</text>
      </g>

      <!-- Benefit 6 -->
      <g transform="translate(500, 112)">
        <circle cx="16" cy="16" r="16" fill="#E8F5E9"/>
        <path d="M 11 16 L 15 20 L 21 12" stroke="#43A047" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="22" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">Free ASO consultation call</text>
      </g>
    </g>
  </g>

  <!-- Trust Indicators -->
  <g transform="translate(220, 1520)">
    <rect width="1000" height="160" rx="8" fill="#FAFAFA"/>

    <!-- Stats -->
    <g transform="translate(100, 50)">
      <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="32" font-weight="700" fill="#FF9800" text-anchor="middle">10,000+</text>
      <text x="0" y="32" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#6D6D6D" text-anchor="middle">App Developers</text>
    </g>

    <g transform="translate(350, 50)">
      <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="32" font-weight="700" fill="#FF9800" text-anchor="middle">4.8/5.0</text>
      <text x="0" y="32" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#6D6D6D" text-anchor="middle">Average Rating</text>
    </g>

    <g transform="translate(600, 50)">
      <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="32" font-weight="700" fill="#FF9800" text-anchor="middle">50M+</text>
      <text x="0" y="32" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#6D6D6D" text-anchor="middle">Keywords Analyzed</text>
    </g>

    <g transform="translate(850, 50)">
      <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="32" font-weight="700" fill="#FF9800" text-anchor="middle">24/7</text>
      <text x="0" y="32" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#6D6D6D" text-anchor="middle">Support Available</text>
