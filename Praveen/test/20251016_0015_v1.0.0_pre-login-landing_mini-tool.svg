      <rect width="920" height="120" rx="8" fill="url(#gradient-unlock)" stroke="#F4511E" stroke-width="2"/>
      <defs>
        <linearGradient id="gradient-unlock" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#FF5722;stop-opacity:0.08"/>
          <stop offset="100%" style="stop-color:#F4511E;stop-opacity:0.12"/>
