      <rect x="96" width="80" height="32" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="136" y="20" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="600" fill="#4A4A4A" text-anchor="middle">SOC2</text>

      <rect x="192" width="80" height="32" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
