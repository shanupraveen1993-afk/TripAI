<svg width="1440" height="1800" viewBox="0 0 1440 1800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1440" height="1800" fill="#FFFFFF"/>

  <!-- Top Navigation Bar (Public) -->
  <g id="top-nav">
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <rect y="72" width="1440" height="1" fill="#E0E0E0"/>

    <!-- Logo -->
    <g transform="translate(80, 20)">
      <rect width="32" height="32" rx="8" fill="#FF9800"/>
      <text x="44" y="22" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600" fill="#1A1A1A">SearchVector</text>
    </g>

    <!-- Navigation Links -->
    <g transform="translate(600, 36)">
      <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="500" fill="#4A4A4A">Features</text>
      <text x="100" y="0" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="500" fill="#4A4A4A">Pricing</text>
      <text x="200" y="0" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="500" fill="#4A4A4A">Resources</text>
      <text x="320" y="0" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="500" fill="#4A4A4A">Blog</text>
    </g>

    <!-- Auth Buttons -->
    <g transform="translate(1180, 20)">
      <rect width="80" height="32" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="20" y="20" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500" fill="#1A1A1A">Sign In</text>

      <rect x="96" width="100" height="32" rx="6" fill="#FF9800"/>
      <text x="110" y="20" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Get Started</text>
    </g>
  </g>

  <!-- Hero Section -->
  <g transform="translate(0, 120)">
    <!-- Heading -->
    <text x="720" y="0" font-family="IBM Plex Sans, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">Find the Perfect Keywords</text>
    <text x="720" y="56" font-family="IBM Plex Sans, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="middle">for Your App</text>

    <!-- Subheading -->
    <text x="720" y="116" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="400" fill="#6D6D6D" text-anchor="middle">Discover high-performing keywords to boost your app's visibility</text>
    <text x="720" y="144" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="400" fill="#6D6D6D" text-anchor="middle">Try our free keyword research tool below</text>
  </g>

  <!-- Free Tool Section -->
  <g transform="translate(220, 320)">
    <!-- Tool Container -->
    <rect width="1000" height="900" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2" style="filter:drop-shadow(0 8px 24px rgba(0,0,0,0.08))"/>

    <!-- Tool Header -->
    <g transform="translate(40, 40)">
      <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="24" font-weight="600" fill="#1A1A1A">Try Free Keyword Research</text>
      <text x="0" y="32" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#6D6D6D">Enter a keyword to see 5 suggestions - no sign up required</text>
    </g>

    <!-- Platform & Country Selector -->
    <g transform="translate(40, 120)">
      <!-- Platform Toggle -->
      <g>
        <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" fill="#4A4A4A">Platform</text>
        <g transform="translate(0, 12)">
          <rect width="200" height="36" rx="18" fill="#F5F5F5"/>
          <rect x="2" y="2" width="96" height="32" rx="16" fill="#FF9800"/>
          <text x="28" y="23" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">iOS</text>
          <text x="124" y="23" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" fill="#6D6D6D">Android</text>
