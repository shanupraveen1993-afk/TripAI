      <text x="0" y="24" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400" fill="#6D6D6D">Showing 5 of 127 total results</text>

      <!-- Simple Table -->
      <g transform="translate(0, 48)">
