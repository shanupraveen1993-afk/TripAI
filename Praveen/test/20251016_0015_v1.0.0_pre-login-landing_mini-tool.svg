        <text x="380" y="25" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Volume</text>
        <text x="520" y="25" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Difficulty</text>
        <text x="680" y="25" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Opportunity</text>

        <!-- Row 1 -->
        <g transform="translate(0, 41)">
          <rect width="920" height="48" fill="#FFFFFF"/>
          <rect y="48" width="920" height="1" fill="#E0E0E0"/>
          <text x="16" y="30" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#1A1A1A">fitness tracker app</text>
          <text x="380" y="30" font-family="Roboto Mono, monospace" font-size="14" font-weight="400" fill="#1A1A1A">45.2K</text>
          <rect x="520" y="12" width="80" height="24" rx="12" fill="#E8F5E9"/>
          <text x="540" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#43A047">Easy (23)</text>
          <rect x="680" y="12" width="60" height="24" rx="12" fill="#E8F5E9"/>
          <text x="694" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#43A047">High</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 89)">
          <rect width="920" height="48" fill="#FFFFFF"/>
          <rect y="48" width="920" height="1" fill="#E0E0E0"/>
          <text x="16" y="30" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#1A1A1A">workout planner</text>
          <text x="380" y="30" font-family="Roboto Mono, monospace" font-size="14" font-weight="400" fill="#1A1A1A">128K</text>
          <rect x="520" y="12" width="100" height="24" rx="12" fill="#FFF3E0"/>
          <text x="535" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FB8C00">Medium (67)</text>
          <rect x="680" y="12" width="80" height="24" rx="12" fill="#FFF3E0"/>
          <text x="690" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FB8C00">Medium</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 137)">
          <rect width="920" height="48" fill="#FFFFFF"/>
          <rect y="48" width="920" height="1" fill="#E0E0E0"/>
          <text x="16" y="30" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#1A1A1A">calorie counter free</text>
          <text x="380" y="30" font-family="Roboto Mono, monospace" font-size="14" font-weight="400" fill="#1A1A1A">89.5K</text>
          <rect x="520" y="12" width="80" height="24" rx="12" fill="#FFEBEE"/>
          <text x="540" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#E53935">Hard (89)</text>
          <rect x="680" y="12" width="60" height="24" rx="12" fill="#F5F5F5"/>
          <text x="698" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#9E9E9E">Low</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(0, 185)">
          <rect width="920" height="48" fill="#FFFFFF"/>
          <rect y="48" width="920" height="1" fill="#E0E0E0"/>
          <text x="16" y="30" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#1A1A1A">step counter pedometer</text>
          <text x="380" y="30" font-family="Roboto Mono, monospace" font-size="14" font-weight="400" fill="#1A1A1A">34.1K</text>
          <rect x="520" y="12" width="80" height="24" rx="12" fill="#E8F5E9"/>
          <text x="540" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#43A047">Easy (18)</text>
          <rect x="680" y="12" width="60" height="24" rx="12" fill="#E8F5E9"/>
          <text x="694" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#43A047">High</text>
        </g>

        <!-- Row 5 -->
        <g transform="translate(0, 233)">
          <rect width="920" height="48" fill="#FFFFFF"/>
          <rect y="48" width="920" height="1" fill="#E0E0E0"/>
          <text x="16" y="30" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#1A1A1A">health and fitness app</text>
          <text x="380" y="30" font-family="Roboto Mono, monospace" font-size="14" font-weight="400" fill="#1A1A1A">156K</text>
          <rect x="520" y="12" width="100" height="24" rx="12" fill="#FFF3E0"/>
          <text x="535" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FB8C00">Medium (54)</text>
          <rect x="680" y="12" width="80" height="24" rx="12" fill="#FFF3E0"/>
          <text x="690" y="28" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="#FB8C00">Medium</text>
        </g>

        <!-- Blur Overlay & Unlock CTA -->
        <g transform="translate(0, 281)">
          <rect width="920" height="120" fill="url(#blur-gradient)"/>
          <defs>
            <linearGradient id="blur-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4"/>
              <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1"/>
            </linearGradient>
          </defs>
        </g>
      </g>
    </g>

    <!-- Unlock CTA Banner -->
