<svg width="1440" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1440" height="1024" fill="#FFFFFF"/>

  <!-- Side Navigation Bar (240px width) -->
  <rect x="0" y="0" width="240" height="1024" fill="#FCFCFD"/>
  <rect x="240" y="0" width="1" height="1024" fill="#F3F4F6"/>

  <!-- Logo -->
  <text x="24" y="40" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#111827">SearchVector</text>

  <!-- Side Menu Items (Simplified) -->
  <g id="menu-items">
    <rect x="16" y="96" width="208" height="40" rx="8" fill="#FF5722" fill-opacity="0.1"/>
    <rect x="16" y="96" width="3" height="40" fill="#FF5722"/>
    <text x="40" y="121" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FF5722">Keyword Research</text>
  </g>

  <!-- Top Navigation Bar -->
  <rect x="240" y="0" width="1200" height="72" fill="#FFFFFF"/>
  <rect x="240" y="72" width="1200" height="1" fill="#F3F4F6"/>

  <!-- Page Title -->
  <text x="272" y="45" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#111827">Keyword Research - Filters</text>

  <!-- User Account -->
  <circle cx="1380" cy="36" r="16" fill="#F9FAFB"/>
  <circle cx="1380" cy="36" r="12" fill="#FF5722"/>
  <text x="1374" y="42" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">JD</text>

  <!-- Main Content Area -->
  <g id="main-content">
    <!-- Search Bar (Compact) -->
    <rect x="272" y="96" width="888" height="48" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="288" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF">fitness tracker</text>
    <rect x="1080" y="104" width="64" height="32" rx="6" fill="#FF5722"/>
    <text x="1093" y="126" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Search</text>

    <!-- Expanded Filter Panel (Main Focus) -->
    <g id="expanded-filters">
      <rect x="272" y="168" width="400" height="800" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

      <!-- Filter Header -->
      <g id="filter-header">
        <text x="296" y="204" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#111827">Filters</text>
        <text x="608" y="204" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FF5722">Clear all</text>

        <!-- Active Filters Count -->
        <circle cx="350" cy="195" r="10" fill="#FF5722"/>
        <text x="345" y="201" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">5</text>
      </g>

      <line x1="296" y1="220" x2="648" y2="220" stroke="#F3F4F6" stroke-width="1"/>

      <!-- Filter Section 1: Platform -->
      <g id="filter-platform">
        <text x="296" y="252" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Platform</text>

        <!-- Platform Options -->
        <rect x="296" y="268" width="328" height="36" rx="8" fill="#F9FAFB"/>

        <rect x="296" y="268" width="160" height="36" rx="8" fill="#FF5722"/>
        <text x="354" y="291" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">iOS App Store</text>

        <rect x="464" y="268" width="160" height="36" rx="8" fill="transparent"/>
        <text x="506" y="291" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#4B5563">Google Play</text>
      </g>

      <!-- Divider -->
      <line x1="296" y1="332" x2="648" y2="332" stroke="#F3F4F6" stroke-width="1"/>

      <!-- Filter Section 2: Search Volume -->
      <g id="filter-search-volume">
        <text x="296" y="364" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Search Volume</text>

        <!-- Min/Max Inputs -->
        <g id="volume-inputs">
          <text x="296" y="392" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Min</text>
          <rect x="296" y="398" width="150" height="36" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
          <text x="312" y="421" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#111827">1,000</text>

          <text x="474" y="392" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Max</text>
          <rect x="474" y="398" width="150" height="36" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
          <text x="490" y="421" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#111827">100,000+</text>
        </g>

        <!-- Range Slider -->
        <g id="volume-slider">
          <line x1="296" y1="466" x2="648" y2="466" stroke="#E5E7EB" stroke-width="3"/>
          <line x1="340" y1="466" x2="580" y2="466" stroke="#FF5722" stroke-width="3"/>
          <circle cx="340" cy="466" r="8" fill="#FF5722"/>
          <circle cx="580" cy="466" r="8" fill="#FF5722"/>

          <!-- Slider Labels -->
          <text x="296" y="488" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF">0</text>
          <text x="428" y="488" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF">50K</text>
          <text x="628" y="488" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF">100K+</text>
        </g>

        <!-- Preset Options -->
        <g id="volume-presets">
          <text x="296" y="516" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Quick select:</text>

          <rect x="296" y="524" width="52" height="24" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
          <text x="313" y="541" font-family="Inter, sans-serif" font-size="11" fill="#4B5563">0-10K</text>

          <rect x="356" y="524" width="64" height="24" rx="12" fill="#FF5722" fill-opacity="0.1" stroke="#FF5722" stroke-width="1"/>
          <text x="370" y="541" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FF5722">1K-100K</text>

          <rect x="428" y="524" width="68" height="24" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
          <text x="438" y="541" font-family="Inter, sans-serif" font-size="11" fill="#4B5563">100K+</text>
        </g>
      </g>

      <!-- Divider -->
      <line x1="296" y1="576" x2="648" y2="576" stroke="#F3F4F6" stroke-width="1"/>

      <!-- Filter Section 3: Difficulty -->
      <g id="filter-difficulty">
        <text x="296" y="608" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Keyword Difficulty</text>

        <!-- Difficulty Checkboxes -->
        <g id="difficulty-options">
          <!-- Low -->
          <rect x="296" y="624" width="328" height="32" rx="6" fill="transparent"/>
          <rect x="296" y="630" width="20" height="20" rx="4" fill="#FF5722"/>
          <text x="300" y="644" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">✓</text>
          <rect x="326" y="630" width="36" height="20" rx="10" fill="#10B981" fill-opacity="0.1"/>
          <text x="334" y="644" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10B981">Low</text>
          <text x="370" y="644" font-family="Inter, sans-serif" font-size="13" fill="#111827">Easy to rank (0-33)</text>
          <text x="590" y="644" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">42</text>

          <!-- Medium -->
          <rect x="296" y="664" width="328" height="32" rx="6" fill="transparent"/>
          <rect x="296" y="670" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
          <rect x="326" y="670" width="52" height="20" rx="10" fill="#F59E0B" fill-opacity="0.1"/>
          <text x="334" y="684" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#F59E0B">Medium</text>
          <text x="386" y="684" font-family="Inter, sans-serif" font-size="13" fill="#111827">Moderate competition (34-66)</text>
          <text x="590" y="684" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">58</text>

          <!-- High -->
          <rect x="296" y="704" width="328" height="32" rx="6" fill="transparent"/>
          <rect x="296" y="710" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
          <rect x="326" y="710" width="36" height="20" rx="10" fill="#EF4444" fill-opacity="0.1"/>
          <text x="334" y="724" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#EF4444">High</text>
          <text x="370" y="724" font-family="Inter, sans-serif" font-size="13" fill="#111827">Very competitive (67-100)</text>
          <text x="590" y="724" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">27</text>
        </g>
      </g>

      <!-- Divider -->
      <line x1="296" y1="756" x2="648" y2="756" stroke="#F3F4F6" stroke-width="1"/>

      <!-- Filter Section 4: Opportunity Score -->
      <g id="filter-opportunity">
        <text x="296" y="788" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Opportunity Score</text>
        <circle cx="410" cy="783" r="8" fill="#E5E7EB"/>
        <text x="407" y="788" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#6B7280">?</text>

        <!-- Opportunity Checkboxes -->
        <g id="opportunity-options">
          <rect x="296" y="804" width="328" height="28" rx="6" fill="transparent"/>
          <rect x="296" y="808" width="20" height="20" rx="4" fill="#FF5722"/>
          <text x="300" y="822" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">✓</text>
          <text x="326" y="822" font-family="Inter, sans-serif" font-size="13" fill="#111827">High opportunity</text>
          <text x="590" y="822" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">31</text>

          <rect x="296" y="840" width="328" height="28" rx="6" fill="transparent"/>
          <rect x="296" y="844" width="20" height="20" rx="4" fill="#FF5722"/>
          <text x="300" y="858" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">✓</text>
          <text x="326" y="858" font-family="Inter, sans-serif" font-size="13" fill="#111827">Medium opportunity</text>
          <text x="590" y="858" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">64</text>

          <rect x="296" y="876" width="328" height="28" rx="6" fill="transparent"/>
          <rect x="296" y="880" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
          <text x="326" y="894" font-family="Inter, sans-serif" font-size="13" fill="#111827">Low opportunity</text>
          <text x="590" y="894" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">32</text>
        </g>
      </g>

      <!-- Divider -->
      <line x1="296" y1="920" x2="648" y2="920" stroke="#F3F4F6" stroke-width="1"/>

      <!-- Apply Filters Button -->
      <rect x="296" y="932" width="328" height="40" rx="8" fill="#FF5722"/>
      <text x="413" y="957" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Apply Filters (127 results)</text>
    </g>

    <!-- Results Preview Panel -->
    <g id="results-preview">
      <rect x="696" y="168" width="464" height="800" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

      <!-- Preview Header -->
      <text x="720" y="204" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#111827">Live Preview</text>
      <text x="720" y="228" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#6B7280">127 keywords match your filters</text>

      <!-- Table Header -->
      <rect x="696" y="248" width="464" height="40" rx="12" fill="#F9FAFB"/>
      <line x1="696" y1="288" x2="1160" y2="288" stroke="#E5E7EB" stroke-width="1"/>

      <text x="720" y="273" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4B5563">KEYWORD</text>
      <text x="940" y="273" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4B5563">VOL</text>
      <text x="1020" y="273" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4B5563">DIFF</text>
      <text x="1100" y="273" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4B5563">TREND</text>

      <!-- Preview Row 1 -->
      <g id="preview-row-1">
        <rect x="696" y="288" width="464" height="52" fill="#FFFFFF"/>
        <line x1="696" y1="340" x2="1160" y2="340" stroke="#F3F4F6" stroke-width="1"/>
        <text x="720" y="319" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">fitness tracker app</text>
        <text x="940" y="319" font-family="Inter, sans-serif" font-size="13" fill="#111827">45.2K</text>
        <rect x="1020" y="306" width="40" height="20" rx="10" fill="#10B981" fill-opacity="0.1"/>
        <text x="1030" y="320" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10B981">23</text>
        <text x="1100" y="319" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">↑ 12%</text>
      </g>

      <!-- Preview Row 2 -->
      <g id="preview-row-2">
        <rect x="696" y="340" width="464" height="52" fill="#F9FAFB"/>
        <line x1="696" y1="392" x2="1160" y2="392" stroke="#F3F4F6" stroke-width="1"/>
        <text x="720" y="371" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">workout planner</text>
        <text x="940" y="371" font-family="Inter, sans-serif" font-size="13" fill="#111827">32.8K</text>
        <rect x="1020" y="358" width="40" height="20" rx="10" fill="#10B981" fill-opacity="0.1"/>
        <text x="1030" y="372" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10B981">18</text>
        <text x="1100" y="371" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">↑ 8%</text>
      </g>

      <!-- Preview Row 3 -->
      <g id="preview-row-3">
        <rect x="696" y="392" width="464" height="52" fill="#FFFFFF"/>
        <line x1="696" y1="444" x2="1160" y2="444" stroke="#F3F4F6" stroke-width="1"/>
        <text x="720" y="423" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">step counter free</text>
        <text x="940" y="423" font-family="Inter, sans-serif" font-size="13" fill="#111827">23.1K</text>
        <rect x="1020" y="410" width="40" height="20" rx="10" fill="#10B981" fill-opacity="0.1"/>
        <text x="1030" y="424" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10B981">15</text>
        <text x="1100" y="423" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">↑ 5%</text>
      </g>

      <!-- Preview Row 4 -->
      <g id="preview-row-4">
        <rect x="696" y="444" width="464" height="52" fill="#F9FAFB"/>
        <line x1="696" y1="496" x2="1160" y2="496" stroke="#F3F4F6" stroke-width="1"/>
        <text x="720" y="475" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">yoga app free</text>
        <text x="940" y="475" font-family="Inter, sans-serif" font-size="13" fill="#111827">29.3K</text>
        <rect x="1020" y="462" width="40" height="20" rx="10" fill="#10B981" fill-opacity="0.1"/>
        <text x="1030" y="476" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10B981">28</text>
        <text x="1100" y="475" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">↑ 22%</text>
      </g>

      <!-- Preview Row 5 -->
      <g id="preview-row-5">
        <rect x="696" y="496" width="464" height="52" fill="#FFFFFF"/>
        <line x1="696" y1="548" x2="1160" y2="548" stroke="#F3F4F6" stroke-width="1"/>
        <text x="720" y="527" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">fitness log</text>
        <text x="940" y="527" font-family="Inter, sans-serif" font-size="13" fill="#111827">15.6K</text>
        <rect x="1020" y="514" width="40" height="20" rx="10" fill="#10B981" fill-opacity="0.1"/>
        <text x="1030" y="528" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10B981">19</text>
        <text x="1100" y="527" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">↑ 9%</text>
      </g>

      <!-- More Results Indicator -->
      <text x="928" y="600" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">+ 122 more keywords...</text>

      <!-- Filter Tips -->
      <rect x="720" y="632" width="416" height="120" rx="8" fill="#FFF4F2"/>
      <text x="736" y="656" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FF5722">💡 Filter Tips</text>
      <text x="736" y="680" font-family="Inter, sans-serif" font-size="12" fill="#4B5563">• Start with low difficulty keywords for quick wins</text>
      <text x="736" y="700" font-family="Inter, sans-serif" font-size="12" fill="#4B5563">• Look for high volume + low difficulty combinations</text>
      <text x="736" y="720" font-family="Inter, sans-serif" font-size="12" fill="#4B5563">• Focus on growing trends for long-term results</text>
      <text x="736" y="740" font-family="Inter, sans-serif" font-size="12" fill="#4B5563">• High opportunity = less competition + good volume</text>

      <!-- Export Preview -->
      <rect x="720" y="772" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="751" y="795" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">Export Results ▼</text>

      <rect x="932" y="772" width="204" height="36" rx="8" fill="#FF5722" fill-opacity="0.1" stroke="#FF5722" stroke-width="1"/>
      <text x="979" y="795" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FF5722">+ Save to List</text>
    </g>
  </g>
</svg>