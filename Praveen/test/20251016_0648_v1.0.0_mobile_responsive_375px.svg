<svg width="375" height="1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="375" height="1400" fill="#FFFFFF"/>

  <!-- Mobile Top Bar -->
  <rect x="0" y="0" width="375" height="56" fill="#FFFFFF"/>
  <rect x="0" y="56" width="375" height="1" fill="#F3F4F6"/>

  <!-- Hamburger Menu -->
  <g id="hamburger-menu">
    <rect x="16" y="18" width="24" height="2" rx="1" fill="#111827"/>
    <rect x="16" y="26" width="24" height="2" rx="1" fill="#111827"/>
    <rect x="16" y="34" width="24" height="2" rx="1" fill="#111827"/>
  </g>

  <!-- Logo -->
  <text x="56" y="37" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#111827">SearchVector</text>

  <!-- User Icon -->
  <circle cx="343" cy="28" r="16" fill="#F9FAFB"/>
  <text x="337" y="34" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF5722">JD</text>

  <!-- Page Title -->
  <text x="16" y="92" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#111827">Keyword Research</text>

  <!-- Usage Indicator -->
  <g id="usage-mobile">
    <rect x="16" y="108" width="343" height="16" rx="8" fill="#F9FAFB"/>
    <rect x="16" y="108" width="171" height="16" rx="8" fill="#FF5722" fill-opacity="0.2"/>
    <text x="120" y="119" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#111827">250/500 keywords used</text>
  </g>

  <!-- Platform Toggle -->
  <g id="platform-toggle-mobile">
    <rect x="16" y="144" width="160" height="40" rx="8" fill="#F9FAFB"/>
    <rect x="16" y="144" width="76" height="40" rx="8" fill="#FF5722"/>
    <text x="38" y="169" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">iOS</text>
    <text x="110" y="169" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#4B5563">Android</text>
  </g>

  <!-- Country Selector -->
  <rect x="184" y="144" width="175" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="200" y="169" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">🇺🇸 US ▼</text>

  <!-- Search Input -->
  <g id="search-mobile">
    <rect x="16" y="200" width="343" height="48" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="28" y="228" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF">Search keyword...</text>
    <rect x="295" y="212" width="52" height="24" rx="6" fill="#FF5722"/>
    <text x="304" y="229" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Search</text>
  </g>

  <!-- Filter Button -->
  <g id="filter-button">
    <rect x="16" y="264" width="100" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="28" y="287" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">🔽 Filters</text>
    <circle cx="103" cy="275" r="8" fill="#FF5722"/>
    <text x="99" y="280" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">3</text>
  </g>

  <!-- Sort Button -->
  <rect x="124" y="264" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="136" y="287" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">Sort ▼</text>

  <!-- Export Button -->
  <rect x="212" y="264" width="72" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="224" y="287" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">Export</text>

  <!-- Save Button -->
  <rect x="292" y="264" width="67" height="36" rx="8" fill="#FF5722" fill-opacity="0.1" stroke="#FF5722" stroke-width="1"/>
  <text x="303" y="287" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FF5722">+ Save</text>

  <!-- Results Count -->
  <text x="16" y="332" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#111827">127 keywords found</text>

  <!-- Consultation CTA - Compact -->
  <g id="consultation-mobile">
    <rect x="16" y="348" width="343" height="72" rx="12" fill="#FFF4F2" stroke="#FF5722" stroke-width="1"/>
    <text x="28" y="372" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#111827">Need ASO help?</text>
    <text x="28" y="391" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4B5563">Book free consultation</text>
    <rect x="248" y="360" width="99" height="32" rx="6" fill="#FF5722"/>
    <text x="264" y="381" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Book Now</text>
  </g>

  <!-- Mobile Keyword Cards -->
  <!-- Card 1 -->
  <g id="keyword-card-1">
    <rect x="16" y="436" width="343" height="112" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Keyword Title -->
    <text x="28" y="460" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">fitness tracker app</text>

    <!-- Metrics Row -->
    <g id="metrics-1">
      <!-- Volume -->
      <text x="28" y="484" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">VOLUME</text>
      <text x="28" y="502" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">45.2K</text>

      <!-- Difficulty -->
      <text x="108" y="484" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">DIFFICULTY</text>
      <rect x="108" y="488" width="48" height="22" rx="11" fill="#10B981" fill-opacity="0.1"/>
      <text x="122" y="503" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">23</text>

      <!-- Trend -->
      <text x="188" y="484" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">TREND</text>
      <text x="188" y="502" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#10B981">↑ 12%</text>
    </g>

    <!-- Action Button -->
    <rect x="28" y="516" width="315" height="20" rx="10" fill="#FF5722" fill-opacity="0.1"/>
    <text x="146" y="530" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF5722">+ Add to List</text>
  </g>

  <!-- Card 2 -->
  <g id="keyword-card-2">
    <rect x="16" y="560" width="343" height="112" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <text x="28" y="584" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">workout planner</text>

    <g id="metrics-2">
      <text x="28" y="608" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">VOLUME</text>
      <text x="28" y="626" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">32.8K</text>

      <text x="108" y="608" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">DIFFICULTY</text>
      <rect x="108" y="612" width="48" height="22" rx="11" fill="#10B981" fill-opacity="0.1"/>
      <text x="122" y="627" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">18</text>

      <text x="188" y="608" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">TREND</text>
      <text x="188" y="626" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#10B981">↑ 8%</text>
    </g>

    <rect x="28" y="640" width="315" height="20" rx="10" fill="#FF5722" fill-opacity="0.1"/>
    <text x="146" y="654" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF5722">+ Add to List</text>
  </g>

  <!-- Card 3 -->
  <g id="keyword-card-3">
    <rect x="16" y="684" width="343" height="112" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <text x="28" y="708" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">calorie counter</text>

    <g id="metrics-3">
      <text x="28" y="732" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">VOLUME</text>
      <text x="28" y="750" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">128K</text>

      <text x="108" y="732" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">DIFFICULTY</text>
      <rect x="108" y="736" width="48" height="22" rx="11" fill="#F59E0B" fill-opacity="0.1"/>
      <text x="122" y="751" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#F59E0B">67</text>

      <text x="188" y="732" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">TREND</text>
      <text x="188" y="750" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#6B7280">→ 0%</text>
    </g>

    <rect x="28" y="764" width="315" height="20" rx="10" fill="#FF5722" fill-opacity="0.1"/>
    <text x="146" y="778" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF5722">+ Add to List</text>
  </g>

  <!-- Card 4 -->
  <g id="keyword-card-4">
    <rect x="16" y="808" width="343" height="112" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <text x="28" y="832" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">step counter free</text>

    <g id="metrics-4">
      <text x="28" y="856" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">VOLUME</text>
      <text x="28" y="874" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">23.1K</text>

      <text x="108" y="856" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">DIFFICULTY</text>
      <rect x="108" y="860" width="48" height="22" rx="11" fill="#10B981" fill-opacity="0.1"/>
      <text x="122" y="875" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#10B981">15</text>

      <text x="188" y="856" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">TREND</text>
      <text x="188" y="874" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#10B981">↑ 5%</text>
    </g>

    <rect x="28" y="888" width="315" height="20" rx="10" fill="#FF5722" fill-opacity="0.1"/>
    <text x="146" y="902" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF5722">+ Add to List</text>
  </g>

  <!-- Card 5 -->
  <g id="keyword-card-5">
    <rect x="16" y="932" width="343" height="112" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <text x="28" y="956" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">exercise tracker</text>

    <g id="metrics-5">
      <text x="28" y="980" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">VOLUME</text>
      <text x="28" y="998" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">18.9K</text>

      <text x="108" y="980" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">DIFFICULTY</text>
      <rect x="108" y="984" width="48" height="22" rx="11" fill="#EF4444" fill-opacity="0.1"/>
      <text x="122" y="999" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#EF4444">89</text>

      <text x="188" y="980" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">TREND</text>
      <text x="188" y="998" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#EF4444">↓ 3%</text>
    </g>

    <rect x="28" y="1012" width="315" height="20" rx="10" fill="#FF5722" fill-opacity="0.1"/>
    <text x="146" y="1026" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF5722">+ Add to List</text>
  </g>

  <!-- Load More Button -->
  <rect x="16" y="1064" width="343" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="135" y="1091" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#111827">Load More</text>

  <!-- Pagination Info -->
  <text x="187" y="1132" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Showing 1-5 of 127</text>

  <!-- Bottom Sheet Filter Indicator (Collapsed) -->
  <g id="bottom-filter-tab">
    <rect x="0" y="1180" width="375" height="220" rx="24" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Handle -->
    <rect x="155" y="1192" width="65" height="4" rx="2" fill="#D1D5DB"/>

    <!-- Filter Summary -->
    <text x="16" y="1224" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Active Filters (3)</text>

    <!-- Filter Tags -->
    <rect x="16" y="1236" width="120" height="28" rx="14" fill="#FF5722" fill-opacity="0.1" stroke="#FF5722" stroke-width="1"/>
    <text x="32" y="1255" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#FF5722">Search: 1K-100K</text>
    <text x="142" y="1255" font-family="Inter, sans-serif" font-size="12" fill="#FF5722">×</text>

    <rect x="148" y="1236" width="100" height="28" rx="14" fill="#FF5722" fill-opacity="0.1" stroke="#FF5722" stroke-width="1"/>
    <text x="164" y="1255" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#FF5722">Difficulty: Low</text>
    <text x="254" y="1255" font-family="Inter, sans-serif" font-size="12" fill="#FF5722">×</text>

    <rect x="16" y="1272" width="120" height="28" rx="14" fill="#FF5722" fill-opacity="0.1" stroke="#FF5722" stroke-width="1"/>
    <text x="32" y="1291" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#FF5722">Trend: Growing</text>
    <text x="142" y="1291" font-family="Inter, sans-serif" font-size="12" fill="#FF5722">×</text>

    <!-- Clear All -->
    <text x="16" y="1328" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FF5722">Clear all filters</text>

    <!-- Expand Button -->
    <rect x="16" y="1348" width="343" height="40" rx="8" fill="#FF5722"/>
    <text x="136" y="1373" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Edit Filters</text>
  </g>

  <!-- Help Button (Floating) -->
  <circle cx="331" cy="1144" r="24" fill="#FF5722"/>
  <text x="322" y="1152" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">?</text>
</svg>